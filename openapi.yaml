  /api/v1/evaluaciones/{id}/aprobar:
    post:
      tags: [Talento - Evaluaciones]
      summary: Aprobar revision
      description: Transicion en_revision → revisado. Solo supervisor/RH.
      operationId: evaluaciones_aprobar
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Transicion realizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransicionResponse"
        "404":
          description: Evaluacion no encontrada
        "422":
          description: Transicion no valida

  /api/v1/evaluaciones/{id}/cerrar:
    post:
      tags: [Talento - Evaluaciones]
      summary: Cerrar evaluacion
      description: Transicion revisado/borrador → cerrado. Solo RH.
      operationId: evaluaciones_cerrar
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Transicion realizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransicionResponse"
        "404":
          description: Evaluacion no encontrada
        "422":
          description: Transicion no valida

  /api/v1/evaluaciones/{id}/devolver:
    post:
      tags: [Talento - Evaluaciones]
