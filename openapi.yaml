      summary: Resumen de dedicacion por alcance
      description: >-
        Suma del porcentaje de dedicacion del alcance general y de cada global
        level (el total de un nivel incluye las tareas generales, porque ese
        nivel tambien las ejecuta). Es informativo: alimenta el aviso de la UI
        cuando la carga no llega a 100%, y nada bloquea guardar.
      operationId: perfil_tareas_dedicacion
      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resumen por alcance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DedicacionAlcance"
        "404":
          description: Perfil no encontrado

