              schema:
                $ref: "#/components/schemas/EquivalenciaResponse"
        "409":
          description: El career level ya tiene equivalencia

  /api/v1/clasificacion-puesto/equivalencias/resolver:
    get:
      tags: [Talento - Clasificacion de Puesto]
      summary: Global grades a los que equivale un career level
      description: >-
        Lista ordenada por `orden`. Es una LISTA porque un nivel abarca un tramo:
        M4 puede ser GG17 y GG18. Con uno solo el formulario de perfil lo
        autocompleta; con varios RH elige entre ellos. Vacia NO es un error:
        significa que RH no configuro la equivalencia y el global grade se
        captura a mano. El sistema nunca deduce la correspondencia.
      operationId: equivalencias_resolver
      security:
        - BearerAuth: []
      parameters:
        - name: career_level_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Global grades del career level; vacia si no hay equivalencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquivalenciaResponse"

