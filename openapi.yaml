          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncuestaEstadoResponse"
        "409":
          description: La encuesta ya está habilitada
        "422":
          description: La sesión no está finalizada
    patch:
      tags: [Level Up - Encuestas]
      summary: Cerrar/reabrir o fijar fecha límite de la encuesta (RH)
      operationId: actualizar_encuesta_sesion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncuestaUpdateRequest"
