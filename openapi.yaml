    get:
      tags: [Talento - Puestos Perfil]
      summary: Estructura WTW (mapa de career paths sobre el eje de global grades)
      description: >-
        Una franja por career path y cada career level con el tramo de global
        grades que abarca. No calcula nada: es la misma posicion que ubica el
        rango de un perfil, puesta sobre un eje comun.


        Vive bajo `/puestos-perfil` a proposito. Los catalogos que tienen estos
        datos (`/career-levels`, `/clasificacion-puesto/*`) pertenecen al modulo
        `puestos-ajustes`, y esta vista debe poder consultarla cualquiera con el
        modulo `puestos`.
      operationId: puestos_perfil_wtw
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Mapa de la estructura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WtwMapaResponse"

