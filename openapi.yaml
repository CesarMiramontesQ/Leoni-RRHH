paths:
  # ── Root ────────────────────────────────────────────
  /:
    get:
      tags: [Root]
      summary: Estado del sistema
      operationId: root_get
      responses:
        "200":
          description: Informacion del sistema
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: string
                  version:
                    type: string
                  status:
                    type: string
                  docs:
                    type: string
                  env:
                    type: string

  /health:
    get:
      tags: [Root]
      summary: Health check
      operationId: health_get
      responses:
        "200":
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/bono-productividad/incidencias:
    get:
      tags: [Bono productividad]
      summary: Incidencias consolidadas (calidad, seguridad, progresivo)
      description: >
        Sin query params devuelve todas las incidencias (activas e historicas) de las seis fuentes.
        Los filtros son opcionales: use solo los que necesite para acotar.
      operationId: bono_productividad_incidencias_list
      security:
        - BearerAuth: []
      parameters:
        - name: empleado_id
          in: query
          required: false
          description: Opcional. Vacio = sin filtro (todos los empleados).
          schema:
            type: integer
        - name: no_empleado
          in: query
          required: false
          description: Opcional. Vacio = sin filtro.
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          description: >-
            Opcional. Vacio = sin filtro (todos los tipos). Valores: calidad, calidad_historico,
            seguridad, seguridad_historico, progresivo, progresivo_historico
          schema:
            type: string
        - name: semana_id
          in: query
          required: false
          description: Opcional. Vacio = sin filtro (todas las semanas).
          schema:
            type: integer
      responses:
        "200":
          description: Lista consolidada desde bono_productividad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonoIncidenciasListaResponse"
        "401":
          description: No autenticado
        "403":
          description: Rol no autorizado
        "422":
          description: Parametro tipo invalido
        "503":
          description: BD externa no disponible o error de consulta

  /api/v1/bono-productividad/incidencias/sync:
    post:
      tags: [Bono productividad]
      summary: Sincronizar incidencias de bono hacia incidencias locales
      description: >-
        Lee incidencias desde bono_productividad (solo lectura), mapea a la tabla local
        `incidencias` de la base principal y evita duplicados por llave BONO::<tipo>::<id>.
        No importa tipos progresivo ni progresivo_historico.
        Por seguridad, dry_run=true por defecto.
      operationId: bono_productividad_incidencias_sync
      security:
        - BearerAuth: []
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Si es true, no inserta; solo calcula conteos.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Límite opcional de registros a procesar.
      responses:
        "200":
          description: Resultado de sincronización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonoIncidenciasSyncResponse"
        "401":
          description: No autenticado
        "403":
          description: Rol no autorizado
        "503":
          description: Error de lectura/inserción en proceso de sincronización

  # ── Autenticacion ───────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [Autenticacion]
      summary: Iniciar sesion
      operationId: auth_login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Tokens de acceso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: Error de validacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /api/v1/auth/logout:
    post:
      tags: [Autenticacion]
      summary: Cerrar sesion
      operationId: auth_logout
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Sesion cerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/refresh:
    post:
      tags: [Autenticacion]
      summary: Renovar access token
      operationId: auth_refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Nuevos tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /api/v1/auth/me:
    get:
      tags: [Autenticacion]
      summary: Perfil del usuario autenticado
      operationId: auth_me
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpleadoResponse"

  /api/v1/auth/sync-it:
    post:
      tags: [Autenticacion]
      summary: Sincronizar IT Mirror
      description: Sincronizacion manual de empleados desde BD espejo. Solo rol RH.
      operationId: auth_sync_it
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Sincronizacion encolada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: string
                    example: pending
                  nota:
                    type: string

  # ── RH Permisos ─────────────────────────────────────
  /api/v1/rh-permisos/me:
    get:
      tags: [RH Permisos]
      summary: Permisos de módulos del usuario autenticado
      operationId: rh_permisos_me
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Permisos efectivos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RhPermisosMeResponse"

  /api/v1/rh-permisos/modulos:
    get:
      tags: [RH Permisos]
      summary: Catálogo de módulos configurables
      operationId: rh_permisos_modulos
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Catálogo de módulos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RhModuloCatalogItem"
        "403":
          description: Requiere usuario admin

  /api/v1/rh-permisos/usuarios:
    get:
      tags: [RH Permisos]
      summary: Listar usuarios gestionados en permisos por módulo (RH e inscritos de otros roles)
      operationId: rh_permisos_usuarios_list
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Usuarios con rol RH más empleados de otros roles inscritos por RH
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RhUsuarioPermisosItem"
        "403":
          description: Requiere usuario admin

  /api/v1/rh-permisos/empleados-buscar:
    get:
      tags: [RH Permisos]
      summary: Buscar empleados activos (cualquier rol) para asignarles accesos
      operationId: rh_permisos_empleados_buscar
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Empleados activos que coinciden con la búsqueda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RhEmpleadoBusquedaItem"
        "403":
          description: Requiere usuario admin

  /api/v1/rh-permisos/usuarios/{empleado_id}:
    post:
      tags: [RH Permisos]
      summary: Inscribir un empleado (cualquier rol) en el sistema de permisos por módulo
      description: >-
        Inscribe al empleado sin alterar su rol. Los usuarios sin rol RH quedan
        marcados con inscrito_modulos_rh=true y con accesos vacíos hasta que se
        les otorguen módulos vía PUT.
      operationId: rh_permisos_usuarios_add
      security:
        - BearerAuth: []
      parameters:
        - name: empleado_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Empleado inscrito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RhUsuarioPermisosItem"
        "403":
          description: Sin permiso
        "409":
          description: Empleado ya inscrito
    put:
      tags: [RH Permisos]
      summary: Actualizar accesos por módulo de un usuario (cualquier rol)
      operationId: rh_permisos_usuarios_update
      security:
        - BearerAuth: []
      parameters:
        - name: empleado_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RhPermisosUpdate"
      responses:
        "200":
          description: Permisos actualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RhUsuarioPermisosItem"
        "403":
          description: Sin permiso o auto-edición prohibida
        "422":
          description: Claves de módulo inválidas
    delete:
      tags: [RH Permisos]
      summary: Quitar a un usuario de la administración de permisos
      description: >-
        Elimina la inscripción y limpia los accesos otorgados desde este módulo,
        sin afectar el rol ni la cuenta. A los usuarios con rol RH se les retira
        el acceso a módulos RH (quedan en vista de empleado, conservando su rol y
        toggle) y se ocultan de la lista; pueden re-agregarse después.
      operationId: rh_permisos_usuarios_delete
      security:
        - BearerAuth: []
      parameters:
        - name: empleado_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Usuario eliminado de la administración de permisos
        "403":
          description: Sin permiso o auto-eliminación prohibida
        "404":
          description: Empleado no encontrado o ya removido / no inscrito

  /api/v1/rh-permisos/usuarios/{empleado_id}/admin:
    put:
      tags: [RH Permisos]
      summary: Otorgar/revocar el permiso de administrar permisos RH
      description: >-
        Otorga (conceder=true) o revoca (conceder=false) el flag
        puede_administrar_permisos_rh (fuente: BD). Candados: no puedes cambiar tu
        propio flag ni revocar al último administrador. Auditado.
      operationId: rh_permisos_usuarios_set_admin
      security:
        - BearerAuth: []
      parameters:
        - name: empleado_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RhAdminPermisosUpdate"
      responses:
        "200":
          description: Flag de administrador actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RhUsuarioPermisosItem"
        "403":
          description: Sin permiso o auto-modificación prohibida
        "404":
          description: Empleado no encontrado
        "409":
          description: No se puede revocar al último administrador

  # ── Dashboard (KPIs de nómina) ──────────────────────
  /api/v1/dashboard/mis-kpis:
    get:
      tags: [Dashboard]
      summary: KPIs de vacaciones y home office del usuario autenticado
      description: >-
        Vacaciones (disponibles y tomadas del ciclo vigente) y días de home office del año
        en curso, leídos de DATOS_ANALISIS (TRESS). Autoservicio: siempre son los del
        usuario autenticado, no recibe empleado_id. Responde 200 aunque la BD externa no
        esté disponible; en ese caso `disponible` es false y los valores vienen en null,
        para que el dashboard cargue igual y la UI muestre un guion en vez de un cero.
      operationId: dashboard_mis_kpis
      security:
        - BearerAuth: []
      responses:
        "200":
          description: KPIs personales (o payload degradado si TRESS no responde)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpisResponse"
        "401":
          description: No autenticado

  # ── Vistas por rol ──────────────────────────────────
  /api/v1/vistas-rol/me:
    get:
      tags: [Vistas por rol]
      summary: Vistas habilitadas para el rol del usuario autenticado
      description: >-
        Devuelve el mapa vista -> habilitado que aplica al usuario. Un admin RH está
        exento solo en Modo RH; si simula empleado/líder/gerente con el toggle
        (cabecera X-RH-UI-Mode) recibe la configuración de ese rol, más la matriz
        completa en `por_rol`. Para roles fuera del alcance (director, rh) todas las
        vistas vienen en true y el gate no aplica.
      operationId: vistas_rol_me
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Vistas del rol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VistaRolMeResponse"

  /api/v1/vistas-rol/catalogo:
    get:
      tags: [Vistas por rol]
      summary: Catálogo de vistas configurables
      operationId: vistas_rol_catalogo
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Catálogo de vistas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VistaRolCatalogItem"
        "403":
          description: Requiere usuario admin

  /api/v1/vistas-rol/config:
    get:
      tags: [Vistas por rol]
      summary: Matriz completa de configuración (rol x vista)
      operationId: vistas_rol_config_get
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Configuración actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VistaRolConfigResponse"
        "403":
          description: Requiere usuario admin
    put:
      tags: [Vistas por rol]
      summary: Aplicar cambios en la configuración de vistas por rol
      description: >-
        Aplica solo los pares (rol, vista) enviados; los no incluidos no se tocan.
        Auditado como VISTAS_ROL_UPDATED. Los cambios aplican sin requerir re-login
        (la configuración no viaja en el JWT), con hasta 30 s de propagación entre
        procesos por el caché.
      operationId: vistas_rol_config_update
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VistaRolConfigUpdate"
      responses:
        "200":
          description: Configuración actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VistaRolConfigResponse"
        "400":
          description: Clave de vista desconocida o rol no configurable
        "403":
          description: Requiere usuario admin

  /api/v1/vistas-rol/config/restaurar:
    post:
      tags: [Vistas por rol]
      summary: Restaurar la configuración inicial
      description: Vuelve al acceso que cada rol tenía de origen. Auditado.
      operationId: vistas_rol_config_restaurar
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Configuración restaurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VistaRolConfigResponse"
        "403":
          description: Requiere usuario admin

  # ── Usuarios ────────────────────────────────────────
  /api/v1/usuarios/roles:
    get:
      tags: [Usuarios]
      summary: Listar roles disponibles
      operationId: usuarios_roles
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RolBrief"

  /api/v1/usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Detalle de usuario
      operationId: usuarios_get
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
    patch:
      tags: [Usuarios]
      summary: Actualizar asignacion de lider o rol
      description: >-
        Actualiza lider, comedor y/o rol del empleado. Modificar `rol_id`
        requiere usuario admin (`is_admin_user`); en caso contrario responde 403.
      operationId: usuarios_patch
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioAsignacionUpdate"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "403":
          description: >-
            Sin permiso. Modificar el rol exige usuario admin.

  # ── Empleados ───────────────────────────────────────
  /api/v1/empleados/resumen:
    get:
      tags: [Empleados]
      summary: Resumen de plantilla
      operationId: empleados_resumen
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Metricas de plantilla
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResumenResponse"

  /api/v1/empleados/catalogo-filtros:
    get:
      tags: [Empleados]
      summary: Catalogos para filtros del directorio
      operationId: empleados_catalogo_filtros
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Areas y puestos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoFiltrosResponse"

  /api/v1/empleados:
    get:
      tags: [Empleados]
      summary: Directorio de empleados (paginado)
      operationId: empleados_list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: q
          in: query
          description: Busqueda por nombre o numero de empleado
          schema:
            type: string
        - name: area_id
          in: query
          schema:
            type: integer
        - name: puesto_id
          in: query
          description: Permite multiples valores
          schema:
            type: array
            items:
              type: integer
        - name: activo
          in: query
          description: "Solo RH: true=activos, false=inactivos, omitir=todos"
          schema:
            type: boolean
        - name: estatus
          in: query
          description: "Supervisor/Gerente: activo, inactivo, permiso"
          schema:
            type: string
            enum: [activo, inactivo, permiso]
        - name: solo_contratos_por_vencer
          in: query
          description: Contratos que vencen en 30 dias
          schema:
            type: boolean
        - name: solo_sin_lider
          in: query
          description: "Solo RH: empleados activos sin lider asignado (mismo criterio que KPI)"
          schema:
            type: boolean
        - name: solo_sin_email
          in: query
          description: "Solo RH: administrativos activos sin email registrado (mismo criterio que KPI)"
          schema:
            type: boolean
      responses:
        "200":
          description: Pagina de empleados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioPageResponse"

  /api/v1/horas-extra/solicitudes/opciones:
    get:
      tags: [Horas Extra]
      summary: Catálogos y empleados elegibles para solicitud (empleado autorizado por RH)
      operationId: horas_extra_solicitud_opciones
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Opciones del formulario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraSolicitudOpcionesResponse"
        "403":
          description: Sin autorización de RH para registrar horas extra

  /api/v1/horas-extra/solicitudes/estadisticas:
    get:
      tags: [Horas Extra]
      summary: Estadísticas de solicitudes del usuario autorizado autenticado
      operationId: horas_extra_solicitud_estadisticas
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Totales agregados de solicitudes propias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraSolicitudEstadisticasResponse"
        "403":
          description: Sin autorización de RH para registrar horas extra

  /api/v1/horas-extra/solicitudes:
    get:
      tags: [Horas Extra]
      summary: Listado de solicitudes creadas por el usuario autorizado autenticado
      operationId: horas_extra_solicitud_list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Solicitudes propias del usuario autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraSolicitudListResponse"
        "403":
          description: Sin autorización de RH para registrar horas extra
    post:
      tags: [Horas Extra]
      summary: Crear solicitud de horas extra (empleado autorizado por RH)
      operationId: horas_extra_solicitud_create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HorasExtraSolicitudCreate"
      responses:
        "201":
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraSolicitudResponse"
        "403":
          description: Sin autorización de RH para registrar horas extra
        "422":
          description: Validación de negocio o payload

  /api/v1/horas-extra/solicitudes/{solicitud_id}:
    get:
      tags: [Horas Extra]
      summary: Detalle de solicitud propia del usuario autorizado
      operationId: horas_extra_solicitud_detalle
      security:
        - BearerAuth: []
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detalle de solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraSolicitudResponse"
        "403":
          description: Sin autorización de RH para registrar horas extra
        "404":
          description: Solicitud no encontrada o no pertenece al usuario

  /api/v1/nominas/horas-extra:
    get:
      tags: [Nóminas]
      summary: Listado de solicitudes de horas extra registradas (una fila por empleado-solicitud)
      operationId: nominas_horas_extra_list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - name: tab
          in: query
          schema:
            type: string
            enum: [todos, pendientes, aprobados, rechazados]
            default: todos
        - name: q
          in: query
          schema:
            type: string
            nullable: true
        - name: area_id
          in: query
          schema:
            type: integer
            nullable: true
        - name: centrocosto_id
          in: query
          schema:
            type: integer
            nullable: true
        - name: lider_empleado_id
          in: query
          schema:
            type: integer
            nullable: true
        - name: semana_inicio
          in: query
          description: Lunes ISO (YYYY-MM-DD) de la semana a filtrar
          schema:
            type: string
            format: date
            nullable: true
        - name: fecha_inicio
          in: query
          description: Fecha mínima de solicitud (inclusive)
          schema:
            type: string
            format: date
            nullable: true
        - name: fecha_fin
          in: query
          description: Fecha máxima de solicitud (inclusive)
          schema:
            type: string
            format: date
            nullable: true
      responses:
        "200":
          description: Filas de horas extra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraListResponse"

  /api/v1/nominas/horas-extra/{solicitud_id}:
    get:
      tags: [Nóminas]
      summary: Detalle de una solicitud de horas extra (vista RH)
      operationId: nominas_horas_extra_detalle
      security:
        - BearerAuth: []
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detalle completo de la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraSolicitudResponse"
        "403":
          description: Sin acceso a Horas Extra
        "404":
          description: Solicitud no encontrada o fuera de alcance

  /api/v1/nominas/horas-extra/aprobaciones/pendientes:
    get:
      tags: [Nóminas]
      summary: Solicitudes de horas extra pendientes de la firma del usuario (gerente regional / director)
      description: >-
        Devuelve las solicitudes con una firma pendiente del tipo que el usuario
        puede firmar según su designación activa en horas_extra_aprobadores.
        Si el usuario no es aprobador, regresa lista vacía.
      operationId: nominas_horas_extra_pendientes
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 12, minimum: 1, maximum: 100 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: area_id, in: query, schema: { type: integer } }
        - { name: centrocosto_id, in: query, schema: { type: integer } }
        - { name: semana_inicio, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Pendientes del aprobador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraPendientesListResponse"

  /api/v1/nominas/horas-extra/aprobaciones/solicitudes:
    get:
      tags: [Nóminas]
      summary: Solicitudes de horas extra asignadas al aprobador (gerente regional / director)
      description: >-
        Devuelve todas las solicitudes donde el usuario tiene una firma del tipo
        que puede representar según horas_extra_aprobadores (pendientes, aprobadas,
        rechazadas o en aprobación parcial).
      operationId: nominas_horas_extra_aprobaciones_solicitudes
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 10, minimum: 1, maximum: 100 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: area_id, in: query, schema: { type: integer } }
        - { name: centrocosto_id, in: query, schema: { type: integer } }
        - { name: semana_inicio, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Solicitudes asignadas al aprobador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraPendientesListResponse"

  /api/v1/nominas/horas-extra/aprobaciones/estadisticas:
    get:
      tags: [Nóminas]
      summary: Estadísticas de solicitudes asignadas al aprobador de horas extra
      operationId: nominas_horas_extra_aprobaciones_estadisticas
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Totales por estado consolidado de solicitudes asignadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraAprobacionEstadisticasResponse"

  /api/v1/nominas/horas-extra/aprobaciones/{solicitud_id}:
    get:
      tags: [Nóminas]
      summary: Detalle de solicitud para aprobación (registra visualización en auditoría)
      description: >-
        Abre la vista de detalle que el aprobador debe consultar antes de aprobar o rechazar.
        Registra el evento HE_SOLICITUD_VIEWED en audit_log.
      operationId: nominas_horas_extra_aprobacion_detalle
      security:
        - BearerAuth: []
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Detalle completo para decisión informada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraAprobacionDetalleResponse"
        "403":
          description: Usuario no asignado como aprobador de la solicitud
        "404":
          description: Solicitud no encontrada

  /api/v1/nominas/horas-extra/{solicitud_id}/aprobar:
    post:
      tags: [Nóminas]
      summary: Aprobar una solicitud de horas extra (firma del aprobador asignado)
      operationId: nominas_horas_extra_aprobar
      security:
        - BearerAuth: []
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comentario: { type: string, nullable: true, maxLength: 500 }
      responses:
        "200":
          description: Estado consolidado tras la aprobación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraEstadoConsolidadoResponse"
        "403":
          description: El usuario no está asignado como aprobador
        "404":
          description: Solicitud no encontrada
        "422":
          description: Solicitud ya aprobada/rechazada, firma duplicada o sin visualización previa del detalle

  /api/v1/nominas/horas-extra/{solicitud_id}/rechazar:
    post:
      tags: [Nóminas]
      summary: Rechazar una solicitud de horas extra (cancela el ciclo, comentario obligatorio)
      operationId: nominas_horas_extra_rechazar
      security:
        - BearerAuth: []
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comentario]
              properties:
                comentario: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Estado consolidado tras el rechazo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraEstadoConsolidadoResponse"
        "403":
          description: El usuario no está asignado como aprobador
        "404":
          description: Solicitud no encontrada
        "422":
          description: Comentario faltante, solicitud no accionable o sin visualización previa del detalle

  /api/v1/nominas/horas-extra/{solicitud_id}/estado:
    get:
      tags: [Nóminas]
      summary: Estado consolidado de una solicitud de horas extra (RH o registrante autorizado)
      operationId: nominas_horas_extra_estado
      security:
        - BearerAuth: []
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Estado calculado a partir de las firmas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraEstadoConsolidadoResponse"
        "403":
          description: Sin acceso a Horas Extra
        "404":
          description: Solicitud no encontrada

  /api/v1/nominas/horas-extra/{solicitud_id}/historial:
    get:
      tags: [Nóminas]
      summary: Historial de firmas de una solicitud de horas extra
      operationId: nominas_horas_extra_historial
      security:
        - BearerAuth: []
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Firmas y estado consolidado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraHistorialResponse"
        "403":
          description: Sin acceso a Horas Extra
        "404":
          description: Solicitud no encontrada

  /api/v1/nominas/ajustes/horas-extra/autorizados:
    get:
      tags: [Nóminas]
      summary: Listado de empleados activos con su autorización para registrar horas extra (solo RH)
      operationId: nominas_ajustes_horas_extra_autorizados_list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: q
          in: query
          description: Búsqueda por nombre, número de empleado, correo, área o puesto.
          schema:
            type: string
            nullable: true
        - name: filtro
          in: query
          schema:
            type: string
            enum: [todos, autorizados, no_autorizados]
            default: todos
      responses:
        "200":
          description: Empleados con estado de autorización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorasExtraAutorizadosListResponse"
        "403":
          description: Solo usuarios con rol RH
    put:
      tags: [Nóminas]
      summary: Otorgar o retirar autorización para registrar horas extra (solo RH)
      operationId: nominas_ajustes_horas_extra_autorizados_update
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
