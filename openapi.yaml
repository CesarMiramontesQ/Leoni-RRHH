openapi: 3.1.0
info:
  title: Plataforma RH Leoni Cable
  description: >
    Plataforma on-premise de Recursos Humanos para Leoni Cable (Mexico).
    Gestiona solicitudes de empleados (vacaciones, permisos), incidencias,
    actas administrativas, comedor/acceso biometrico, organigrama e
    integracion con nomina TRESS.
  version: 1.0.0
  contact:
    name: Leoni Cable - Equipo de Desarrollo

servers:
  - url: http://localhost:8000
    description: Desarrollo local (Docker)

tags:
  - name: Root
    description: Health check y estado del sistema
  - name: Autenticacion
    description: Login, logout, refresh de tokens JWT
  - name: Usuarios
    description: Gestion de cuentas de usuario (CRUD)
  - name: Empleados
    description: Directorio de empleados, Vista 360 y metricas
  - name: Solicitudes
    description: Vacaciones, permisos, home office y flujo de aprobacion
  - name: Incidencias
    description: Registro y seguimiento de incidencias laborales
  - name: Actas Administrativas
    description: Generacion, edicion, firma y PDF de actas
  - name: Comedor
    description: Menu semanal, reservas, acceso biometrico y terminal
  - name: Reportes
    description: Dashboard KPIs y exportacion PDF/Excel
  - name: Notificaciones
    description: Bandeja de notificaciones del usuario
  - name: Organigrama
    description: Estructura jerarquica organizacional
  - name: Talento - Competencias
    description: Gestion de competencias y matriz de competencias por area
  - name: Talento - Puestos Perfil
    description: Perfiles de puesto con competencias, habilidades y generacion IA
  - name: Bono productividad
    description: Lectura de datos en la base externa bono_productividad (PostgreSQL)
  - name: Talento - Evaluaciones
    description: Evaluaciones de competencias por empleado (CRUD, bulk, permisos por rol)
  - name: Talento - Capacitaciones
    description: Gestion de capacitaciones (CRUD, inscripciones, catalogo)
  - name: Talento - PDI
    description: Plan de Desarrollo Individual — KPIs avanzados, recomendaciones AI, export, notificaciones

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clave de API para terminales de comedor

  schemas:
    # ── Auth ──────────────────────────────────────────
    TokenResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # ── Catalogos base ────────────────────────────────
    AreaResponse:
      type: object
      required: [area_id, descripcion, estatus_id]
      properties:
        area_id:
          type: integer
        descripcion:
          type: string
        estatus_id:
          type: integer

    SubareaResponse:
      type: object
      required: [subarea_id, area_id, descripcion, estatus_id]
      properties:
        subarea_id:
          type: integer
        area_id:
          type: integer
        descripcion:
          type: string
        estatus_id:
          type: integer

    PuestoResponse:
      type: object
      required: [puesto_id, descripcion, estatus_id]
      properties:
        puesto_id:
          type: integer
        area_id:
          type: [integer, "null"]
        descripcion:
          type: string
        estatus_id:
          type: integer

    CategoriaResponse:
      type: object
      required: [categoria_id, estatus_id]
      properties:
        categoria_id:
          type: integer
        descripcion:
          type: [string, "null"]
        nivel:
          type: [string, "null"]
        estatus_id:
          type: integer

    EstadoEmpleadoResponse:
      type: object
      required: [estado_id, descripcion, estatus_id]
      properties:
        estado_id:
          type: integer
        descripcion:
          type: string
        estatus_id:
          type: integer

    ClasificacionEmpleadoResponse:
      type: object
      required: [clasificacion_id, descripcion, estatus_id]
      properties:
        clasificacion_id:
          type: integer
        descripcion:
          type: string
        significado:
          type: [string, "null"]
        estatus_id:
          type: integer

    RolBrief:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
        nombre:
          type: string

    RhModuloCatalogItem:
      type: object
      required: [key, label, group, nav_item_ids]
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        nav_item_ids:
          type: array
          items:
            type: string

    RhPermisosMeResponse:
      type: object
      required: [rol, puede_administrar_permisos_rh, modulos, inscrito, en_lista_permisos]
      properties:
        rol:
          type: string
        puede_administrar_permisos_rh:
          type: boolean
        modulos:
          type: object
          additionalProperties:
            type: boolean
        inscrito:
          type: boolean
        en_lista_permisos:
          type: boolean
          description: >-
            El usuario aparece en la lista de administración de permisos. Un RH
            removido sigue inscrito pero queda fuera de la lista; el toggle
            Modo RH/empleado solo se muestra cuando es true.

    RhUsuarioPermisosItem:
      type: object
      required:
        - empleado_id
        - no_empleado
        - nombre
        - rol_nombre
        - activo
        - permisos_personalizados
        - puede_administrar_permisos_rh
        - modulos
        - editable
      properties:
        empleado_id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        email:
          type: [string, "null"]
        rol_nombre:
          type: string
        activo:
          type: boolean
        permisos_personalizados:
          type: boolean
        puede_administrar_permisos_rh:
          type: boolean
        modulos:
          type: object
          additionalProperties:
            type: boolean
        editable:
          type: boolean

    RhEmpleadoBusquedaItem:
      type: object
      required: [empleado_id, no_empleado, nombre, rol_nombre]
      properties:
        empleado_id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        email:
          type: [string, "null"]
        rol_nombre:
          type: string

    RhPermisosUpdate:
      type: object
      required: [modulos]
      properties:
        modulos:
          type: object
          additionalProperties:
            type: boolean

    # ── Empleados / Usuarios ──────────────────────────
    EmpleadoResponse:
      type: object
      required: [id, empleado_id, no_empleado, nombre]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: integer
        no_sap:
          type: [integer, "null"]
        nombre:
          type: string
        email:
          type: [string, "null"]
        usuario:
          type: [string, "null"]
        rol_id:
          type: [integer, "null"]
          description: Rol del proyecto (levelup_empleados_core); null si el empleado de Bono no tiene cuenta.
        categoria:
          $ref: "#/components/schemas/CategoriaResponse"
        subarea:
          $ref: "#/components/schemas/SubareaResponse"
        puesto:
          $ref: "#/components/schemas/PuestoResponse"
        estado:
          $ref: "#/components/schemas/EstadoEmpleadoResponse"
        area:
          $ref: "#/components/schemas/AreaResponse"
        clasificacion:
          $ref: "#/components/schemas/ClasificacionEmpleadoResponse"
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        centrocosto_id:
          type: [integer, "null"]
        recibe_bono:
          type: [boolean, "null"]
        brigada:
          type: [string, "null"]
        registro:
          type: [string, "null"]
          description: Texto de alta tal como vive en Bono (columna String, no necesariamente fecha ISO).
        a_restringido:
          type: [string, "null"]
          description: Valor 'S'/'N' tal como vive en Bono.
        requiere_cambio_password:
          type: [boolean, "null"]
        created_at:
          type: [string, "null"]
          format: date-time

    UsuarioResponse:
      type: object
      required: [id, empleado_id, no_empleado, nombre]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: integer
        nombre:
          type: string
        email:
          type: [string, "null"]
        rol_id:
          type: [integer, "null"]
          description: Rol del proyecto (levelup_empleados_core); null si el empleado de Bono no tiene cuenta.
        rol:
          $ref: "#/components/schemas/RolBrief"
        estado:
          $ref: "#/components/schemas/EstadoEmpleadoResponse"
        area:
          $ref: "#/components/schemas/AreaResponse"
        subarea:
          $ref: "#/components/schemas/SubareaResponse"
        puesto:
          $ref: "#/components/schemas/PuestoResponse"
        categoria:
          $ref: "#/components/schemas/CategoriaResponse"
        clasificacion:
          $ref: "#/components/schemas/ClasificacionEmpleadoResponse"
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        centrocosto_id:
          type: [integer, "null"]
        foto:
          type: [string, "null"]
        registro:
          type: [string, "null"]
          description: Texto de alta tal como vive en Bono (columna String, no necesariamente fecha ISO).
        created_at:
          type: [string, "null"]
          format: date-time

    UsuarioListItem:
      allOf:
        - $ref: "#/components/schemas/UsuarioResponse"
        - type: object
          properties:
            lider_nombre:
              type: [string, "null"]

    UsuarioAsignacionUpdate:
      type: object
      properties:
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        rol_id:
          type: [integer, "null"]
        comedor_id:
          type: integer
          minimum: 1
          description: ID del comedor en catálogo; persiste en turnos_empleados

    UsuarioPageResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsuarioListItem"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    HorasExtraLiderResponse:
      type: object
      required: [empleado_id, nombre]
      properties:
        empleado_id:
          type: integer
        nombre:
          type: string

    HorasExtraEmpleadoResponse:
      type: object
      required: [id, empleado_id, no_empleado, nombre]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        puesto_nombre:
          type: string
          nullable: true
        centrocosto_id:
          type: integer
          nullable: true
        lider:
          $ref: "#/components/schemas/HorasExtraLiderResponse"
          nullable: true

    HorasExtraSolicitudInfoResponse:
      type: object
      required:
        - solicitud_id
        - semana
        - semana_inicio
        - fecha_solicitud
        - tipo
        - centrocosto_id
        - estado
        - estado_consolidado
        - total_horas
      properties:
        solicitud_id:
          type: integer
        semana:
          type: integer
        semana_inicio:
          type: string
          format: date
        fecha_solicitud:
          type: string
          format: date
        tipo:
          type: string
          enum: [planeado, espontaneo]
        area_descripcion:
          type: string
          nullable: true
        centrocosto_id:
          type: integer
        centrocosto_descripcion:
          type: string
          nullable: true
        motivo:
          type: string
          nullable: true
        estado:
          type: string
          enum: [borrador, pendiente, aprobado, rechazado, cancelado]
        estado_consolidado:
          type: string
          enum: [pendiente, aprobado_parcial, aprobado, rechazado]
        total_horas:
          type: number
        registrado_por_nombre:
          type: string
          nullable: true
        aprobador_nombre:
          type: string
          nullable: true
        fecha_aprobacion:
          type: string
          format: date
          nullable: true

    HorasExtraFilaResponse:
      type: object
      required: [empleado, solicitud]
      properties:
        empleado:
          $ref: "#/components/schemas/HorasExtraEmpleadoResponse"
        solicitud:
          $ref: "#/components/schemas/HorasExtraSolicitudInfoResponse"

    HorasExtraResumenResponse:
      type: object
      required:
        - total_horas_extra
        - colaboradores_con_registro
        - empleados_con_horas_extra
        - empleados_activos_planta
        - solicitudes_total
        - solicitudes_pendientes
        - solicitudes_aprobadas
        - solicitudes_rechazadas
        - porcentaje_aprobacion
      properties:
        total_horas_extra:
          type: number
        colaboradores_con_registro:
          type: integer
        empleados_con_horas_extra:
          type: integer
        empleados_activos_planta:
          type: integer
        solicitudes_total:
          type: integer
        solicitudes_pendientes:
          type: integer
        solicitudes_aprobadas:
          type: integer
        solicitudes_rechazadas:
          type: integer
        porcentaje_aprobacion:
          type: number

    HorasExtraCentroCostoOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: integer
        label:
          type: string

    HorasExtraFilterOptionsResponse:
      type: object
      required: [centros_costo]
      properties:
        centros_costo:
          type: array
          items:
            $ref: "#/components/schemas/HorasExtraCentroCostoOption"

    HorasExtraCatalogoOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: integer
        label:
          type: string

    HorasExtraSubareaOption:
      type: object
      required: [id, label, area_id]
      properties:
        id:
          type: integer
        label:
          type: string
        area_id:
          type: integer

    HorasExtraEmpleadoOption:
      type: object
      required: [id, no_empleado, nombre]
      properties:
        id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        centrocosto_id:
          type: [integer, "null"]
        area_id:
          type: [integer, "null"]
        subarea_id:
          type: [integer, "null"]
        area_descripcion:
          type: [string, "null"]
        centrocosto_descripcion:
          type: [string, "null"]
        turno:
          type: [string, "null"]

    HorasExtraSolicitudOpcionesResponse:
      type: object
      required: [empleados, semana_actual]
      properties:
        empleados:
          type: array
          items:
            $ref: "#/components/schemas/HorasExtraEmpleadoOption"
        semana_actual:
          type: integer
          minimum: 1
          maximum: 53

    HorasExtraDetalleCreate:
      type: object
      required: [empleado_id, lunes, martes, miercoles, jueves, viernes, sabado, domingo]
      properties:
        empleado_id:
          type: integer
        lunes:
          type: number
          minimum: 0
        martes:
          type: number
          minimum: 0
        miercoles:
          type: number
          minimum: 0
        jueves:
          type: number
          minimum: 0
        viernes:
          type: number
          minimum: 0
        sabado:
          type: number
          minimum: 0
        domingo:
          type: number
          minimum: 0

    HorasExtraSolicitudCreate:
      type: object
      required:
        - semana
        - tipo
        - motivo
        - empleados
      properties:
        semana:
          type: integer
          minimum: 1
          maximum: 53
        tipo:
          type: string
          enum: [planeado, espontaneo]
        motivo:
          type: string
          minLength: 1
          maxLength: 500
        empleados:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/HorasExtraDetalleCreate"

    HorasExtraDetalleResponse:
      type: object
      required:
        - id
        - empleado_id
        - no_empleado
        - nombre_empleado
        - lunes
        - martes
        - miercoles
        - jueves
        - viernes
        - sabado
        - domingo
        - total_horas
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: string
        nombre_empleado:
          type: string
        lunes:
          type: number
        martes:
          type: number
        miercoles:
          type: number
        jueves:
          type: number
        viernes:
          type: number
        sabado:
          type: number
        domingo:
          type: number
        total_horas:
          type: number

    HorasExtraSolicitudResponse:
      type: object
      required:
        - id
        - fecha_solicitud
        - semana
        - semana_inicio
        - tipo
        - area_id
        - area_descripcion
        - subarea_id
        - subarea_descripcion
        - centrocosto_id
        - centrocosto_descripcion
        - motivo_id
        - motivo_descripcion
        - estado
        - estado_consolidado
        - total_horas_general
        - total_empleados
        - created_at
        - detalle
      properties:
        id:
          type: integer
        fecha_solicitud:
          type: string
          format: date
        semana:
          type: integer
          minimum: 1
          maximum: 53
        semana_inicio:
          type: string
          format: date
        tipo:
          type: string
          enum: [planeado, espontaneo]
        area_id:
          type: integer
        area_descripcion:
          type: string
        subarea_id:
          type: integer
        subarea_descripcion:
          type: string
        centrocosto_id:
          type: integer
        centrocosto_descripcion:
          type: string
        motivo_id:
          type: integer
        motivo_descripcion:
          type: string
        comentarios:
          type: [string, "null"]
        estado:
          type: string
          enum: [borrador, pendiente, aprobado, rechazado, cancelado]
        estado_consolidado:
          type: string
          enum: [pendiente, aprobado_parcial, aprobado, rechazado]
        total_horas_general:
          type: number
        total_empleados:
          type: integer
        created_at:
          type: string
          format: date-time
        detalle:
          type: array
          items:
            $ref: "#/components/schemas/HorasExtraDetalleResponse"

    HorasExtraSolicitudListItem:
      type: object
      required:
        - id
        - fecha_solicitud
        - semana
        - semana_inicio
        - area_descripcion
        - tipo
        - total_horas_general
        - estado
        - estado_consolidado
        - created_at
      properties:
        id:
          type: integer
        fecha_solicitud:
          type: string
          format: date
        semana:
          type: integer
          minimum: 1
          maximum: 53
        semana_inicio:
          type: string
          format: date
        area_descripcion:
          type: string
        tipo:
          type: string
          enum: [planeado, espontaneo]
        total_horas_general:
          type: number
        estado:
          type: string
          enum: [borrador, pendiente, aprobado, rechazado, cancelado]
        estado_consolidado:
          type: string
          enum: [pendiente, aprobado_parcial, aprobado, rechazado]
        created_at:
          type: string
          format: date-time

    HorasExtraSolicitudListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HorasExtraSolicitudListItem"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    HorasExtraSolicitudEstadisticasResponse:
      type: object
      required: [total_solicitudes, pendientes, aprobadas, total_horas]
      properties:
        total_solicitudes:
          type: integer
          minimum: 0
        pendientes:
          type: integer
          minimum: 0
        aprobadas:
          type: integer
          minimum: 0
        total_horas:
          type: number
          minimum: 0

    HorasExtraAutorizadoItem:
      type: object
      required: [id, no_empleado, nombre, rol, autorizado]
      properties:
        id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        rol:
          type: string
        email:
          type: string
          nullable: true
        area_descripcion:
          type: string
          nullable: true
        puesto_descripcion:
          type: string
          nullable: true
        autorizado:
          type: boolean
        fecha_autorizacion:
          type: string
          format: date-time
          nullable: true
        autorizado_por:
          type: string
          nullable: true
          description: Nombre del usuario RH que otorgó la autorización.

    HorasExtraAutorizadosStats:
      type: object
      required:
        [
          total_autorizados,
          autorizaciones_activas,
          sin_autorizacion,
          autorizaciones_recientes,
          solicitudes_pendientes,
        ]
      properties:
        total_autorizados:
          type: integer
          description: Empleados autorizados sin importar su estado laboral.
        autorizaciones_activas:
          type: integer
          description: Empleados autorizados con estado laboral activo.
        sin_autorizacion:
          type: integer
          description: Empleados activos sin autorización.
        autorizaciones_recientes:
          type: integer
          description: Autorizaciones otorgadas en los últimos 7 días.
        solicitudes_pendientes:
          type: integer
          description: Solicitudes de horas extra en estado pendiente.

    HorasExtraAutorizadosListResponse:
      type: object
      required: [items, total, page, page_size, stats]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HorasExtraAutorizadoItem"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        stats:
          $ref: "#/components/schemas/HorasExtraAutorizadosStats"

    HorasExtraAutorizacionUpdate:
      type: object
      required: [empleado_ids, autorizado]
      properties:
        empleado_ids:
          type: array
          minItems: 1
          items:
            type: integer
        autorizado:
          type: boolean

    HorasExtraAutorizacionUpdateResponse:
      type: object
      required: [actualizados, stats]
      properties:
        actualizados:
          type: integer
        stats:
          $ref: "#/components/schemas/HorasExtraAutorizadosStats"

    HorasExtraAprobadorItem:
      type: object
      required: [id, empleado_id, no_empleado, nombre, tipo, activo, created_at]
      properties:
        id:
          type: integer
          description: Id del registro de aprobador (no del empleado).
        empleado_id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        email:
          type: string
          nullable: true
        area_descripcion:
          type: string
          nullable: true
        puesto_descripcion:
          type: string
          nullable: true
        tipo:
          type: string
          enum: [gerente_regional, director]
        activo:
          type: boolean
        created_at:
          type: string
          format: date-time

    HorasExtraAprobadoresListResponse:
      type: object
      required: [gerentes, directores]
      properties:
        gerentes:
