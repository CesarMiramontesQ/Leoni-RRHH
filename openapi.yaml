    # Career Level de la clasificacion Willis Towers Watson. El recurso conserva
    # el nombre `grados-puesto`; codigo, nombre y orden son unicos DENTRO del
    # career path (P1 y M1 conviven).
    # El career level no tiene orden propio: lo posiciona el Global Grade al que
    # equivale. Sin equivalencia configurada no puede formar parte del rango de
    # un perfil.
    GradoPuestoCreate:
      type: object
      required: [career_path_id, codigo, nombre]
      properties:
        career_path_id:
          type: integer
          minimum: 1
        codigo:
          type: string
          minLength: 1
          maxLength: 10
          description: >-
            Codigo del career path seguido de un numero entero >= 1, sin ceros a
            la izquierda (P1, P10, M3). El prefijo se acepta sin distinguir
            mayusculas y se guarda con el codigo exacto del path: 'p10' -> 'P10'.
            Un codigo que no cumpla la regla devuelve 422.
        nombre:
          type: string
          minLength: 2
          maxLength: 100

    GradoPuestoUpdate:
      type: object
      required: [career_path_id, codigo, nombre]
      properties:
        career_path_id:
          type: integer
          minimum: 1
        codigo:
          type: string
          minLength: 1
          maxLength: 10
          description: >-
            Codigo del career path seguido de un numero (P1, P10, M3). El
            prefijo exigido es el del career path que trae el payload, no el que
            tenga el nivel hoy.
        nombre:
          type: string
          minLength: 2
          maxLength: 100

    GradoPuestoResponse:
      type: object
      required: [id, career_path_id, codigo, nombre, activo, created_at, updated_at]
      properties:
        id:
          type: integer
        career_path_id:
          type: integer
        career_path_codigo:
          type: string
          nullable: true
        career_path_nombre:
          type: string
          nullable: true
        codigo:
          type: string
        nombre:
          type: string
        global_grades:
          type: array
          description: >-
            Global Grades que abarca el career level, ordenados por `orden`. Un
            nivel abarca un TRAMO (M4 = GG17 + GG18), no un grade suelto: por eso
            dos empleados en M4 pueden estar clasificados distinto. Vacio =
            equivalencia sin configurar, y entonces el nivel no se puede ubicar
            en el rango de un perfil.
          items:
            type: object
            required: [id, codigo, orden]
            properties:
              id:
                type: integer
              codigo:
                type: string
              orden:
                type: integer
        posicion_desde:
          type: [integer, "null"]
          description: Extremo inferior del tramo. Null si no hay equivalencias.
        posicion_hasta:
          type: [integer, "null"]
          description: Extremo superior del tramo.
        activo:
          type: boolean
        reactivado:
          type: boolean
          default: false
          description: >-
            Solo lo llena el POST: `true` cuando el codigo pedido ocupaba un
            career level desactivado y se reactivo la misma fila (mismo id) en
            vez de crear una nueva. En los listados siempre llega `false`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GradoPuestoListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GradoPuestoResponse"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

