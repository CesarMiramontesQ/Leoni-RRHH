          nullable: true
        error:
          type: string

    BonoIncidenciasSyncResponse:
      type: object
      required:
        - dry_run
        - total_leidos_bono
        - total_considerados
        - total_insertados
        - total_actualizados_existentes
        - total_omitidos_duplicado
        - total_omitidos_sin_empleado
        - total_omitidos_invalidos
        - total_omitidos_tipo_excluido
        - errores
        - mapeo_campos
      properties:
        dry_run:
          type: boolean
        total_leidos_bono:
          type: integer
        total_considerados:
          type: integer
        total_insertados:
          type: integer
        total_actualizados_existentes:
          type: integer
        total_omitidos_duplicado:
          type: integer
        total_omitidos_sin_empleado:
          type: integer
        total_omitidos_invalidos:
          type: integer
        total_omitidos_tipo_excluido:
          type: integer
          description: >-
            Filas de bono no importadas por tipo excluido del sync (progresivo, progresivo_historico).
        errores:
          type: array
          items:
            $ref: "#/components/schemas/BonoSyncErrorItem"
        mapeo_campos:
          type: object
          additionalProperties:
            type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ── Evaluaciones de Competencias ──────────────────────
    EvaluacionCreate:
      type: object
      required: [empleado_id, competencia_id, nivel_actual]
      properties:
        empleado_id:
          type: integer
        competencia_id:
