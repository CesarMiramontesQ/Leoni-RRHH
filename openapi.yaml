      required: [id, capacitacion_id, empleado_id, estado, fecha_inscripcion]
      properties:
        id:
          type: integer
        capacitacion_id:
          type: integer
        capacitacion_nombre:
          type: [string, "null"]
        empleado_id:
          type: integer
        empleado_nombre:
          type: [string, "null"]
        estado:
          type: string
        calificacion:
          type: [integer, "null"]
        fecha_inscripcion:
          type: string
          format: date-time
        fecha_completado:
