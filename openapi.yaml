          type: integer
        competencia_nombre:
          type: string
        categoria:
          type: string
        niveles:
          type: object
          additionalProperties:
            type: integer
          description: "Mapa puesto_perfil_id → nivel_requerido"

    MatrizResponse:
      type: object
      required: [area_id, puestos, competencias]
      properties:
        area_id:
          type: integer
        area_nombre:
          type: [string, "null"]
        puestos:
          type: array
          items:
            $ref: "#/components/schemas/PuestoPerfilResponse"
        competencias:
          type: array
          items:
            $ref: "#/components/schemas/MatrizRow"

    MatrizBulkUpdate:
      type: object
