  /api/v1/perfiles/{perfil_id}/competencias/sync:
    put:
      tags: [Talento - Perfil Funciones]
      summary: Sync competencias requeridas por subcategoría (multi-select)
      description: |
        Recibe el set completo de competencias para una subcategoría con nivel mínimo requerido (1-4) por puesto.
        Agrega las faltantes, actualiza niveles y elimina las deseleccionadas. Solo RH o supervisor.
        El campo legado competencia_ids asigna nivel 1 en altas nuevas.
      operationId: sync_perfil_competencias
      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilCompetenciaSyncBody"
      responses:
        "200":
          description: Lista actualizada de competencias del perfil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerfilCompetenciaResponse"
        "403":
          description: Sin permisos (no es RH ni supervisor)
        "404":
          description: Perfil no encontrado
        "422":
          description: competencia_ids inválidos para la subcategoría

  /api/v1/perfiles/{perfil_id}/asignaciones/{asignacion_id}/competencias-eval:
    put:
      tags: [Talento - Perfil Funciones]
      summary: Sync evaluación de competencias del empleado
      description: |
        Recibe el set completo de competencia_requisito_ids que el empleado cumple.
        Crea registros para los presentes, elimina los ausentes. Solo RH o supervisor.
      operationId: sync_evaluacion_competencias
      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
        - name: asignacion_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluacionCompetenciaSyncBody"
      responses:
        "200":
          description: Gap analysis actualizado de la asignación
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Sin permisos
        "404":
          description: Perfil o asignación no encontrados
        "422":
          description: competencia_requisito_ids inválidos
