      summary: Registros operativos por rango de fechas (RH)
      description: >-
        Listado paginado para analítica del Reporte comedor; incluye fechas pasadas y futuras dentro del rango [desde, hasta].
      operationId: comedor_rh_registros_reporte
      security:
        - BearerAuth: []
      parameters:
        - name: desde
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: >-
            Debe ser 5, 10, 50, 500 o 1000; cualquier otro valor devuelve 409. Los lotes
