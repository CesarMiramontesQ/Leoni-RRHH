            application/json:
              schema:
                $ref: "#/components/schemas/CareerPathResponse"
        "409":
          description: Codigo, nombre u orden duplicado

  /api/v1/clasificacion-puesto/career-paths/{id}:
    get:
      tags: [Talento - Clasificacion de Puesto]
      summary: Obtener career path
      operationId: career_paths_get
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Career path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPathResponse"
        "404":
          description: No encontrado
    patch:
      tags: [Talento - Clasificacion de Puesto]
      summary: Actualizar career path
      description: >-
        Solo RH. El **codigo** no se puede cambiar si el path ya tiene career
        levels: es el prefijo del codigo de todos ellos. El **nombre** si.
      operationId: career_paths_update
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerPathUpdate"
      responses:
        "200":
          description: Career path actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPathResponse"
        "409":
          description: >-
            Se intento cambiar el codigo de un career path que tiene career
            levels colgando de el.
    delete:
      tags: [Talento - Clasificacion de Puesto]
      summary: Desactivar career path (soft delete)
      description: Solo RH. Falla si tiene career levels o perfiles asociados.
      operationId: career_paths_delete
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Career path desactivado
        "409":
          description: En uso

