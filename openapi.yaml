            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string

    BonoIncidenciaConsolidadaItem:
      type: object
      required: [tipo, id, empleado_id]
      properties:
        tipo:
          type: string
          example: calidad
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: string
          nullable: true
        nombre:
          type: string
          nullable: true
        fecha:
          type: string
          format: date
          nullable: true
        semana_id:
          type: integer
          nullable: true
        numero_semana:
          type: integer
          nullable: true
        categoria:
          type: string
          nullable: true
        detalle:
          type: string
          nullable: true
        descuento_porcentaje:
          type: number
          format: float
          nullable: true
        estatus_id:
          type: integer
          nullable: true
        area:
          type: string
          nullable: true
        subarea:
          type: string
          nullable: true

    BonoIncidenciasListaResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BonoIncidenciaConsolidadaItem"

    BonoSyncErrorItem:
      type: object
