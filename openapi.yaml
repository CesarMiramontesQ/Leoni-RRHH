          required: false
          schema:
            type: integer
        - name: no_empleado
          in: query
          required: false
          schema:
            type: string
        - name: nombre
          in: query
          required: false
          schema:
            type: string
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: categoria
          in: query
          required: false
          schema:
