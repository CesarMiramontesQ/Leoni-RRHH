  # ── Encuestas RH (Level Up / Talento) ────────────────────────────────────
  /api/v1/encuestas-rh/encuestas:
    get:
      tags: [Talento - Encuestas RH]
      summary: Listar encuestas (filtro opcional por estado)
      operationId: encuestas_rh_list_encuestas
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [borrador, publicada, cerrada] } }
      responses:
        "200": { description: Encuestas, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [Talento - Encuestas RH]
      summary: Crear encuesta en borrador (creado_por_id se toma del token, no del body)
      operationId: encuestas_rh_create_encuesta
      security: [ { BearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Encuesta creada, content: { application/json: { schema: { type: object } } } }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}:
    get:
      tags: [Talento - Encuestas RH]
      summary: Detalle de encuesta (con preguntas y opciones)
      operationId: encuestas_rh_get_encuesta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Encuesta, content: { application/json: { schema: { type: object } } } }
        "404": { description: Encuesta no encontrada }
    put:
      tags: [Talento - Encuestas RH]
      summary: Actualizar encuesta (publicada solo permite titulo/descripcion/extender fecha de cierre)
      operationId: encuestas_rh_update_encuesta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Encuesta actualizada, content: { application/json: { schema: { type: object } } } }
        "422": { description: Campo no editable en encuesta publicada }
    delete:
      tags: [Talento - Encuestas RH]
      summary: Eliminar encuesta (solo en borrador)
      operationId: encuestas_rh_delete_encuesta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "204": { description: Encuesta eliminada }
        "409": { description: Solo se pueden borrar encuestas en borrador }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/preguntas:
    post:
      tags: [Talento - Encuestas RH]
      summary: Agregar pregunta a una encuesta en borrador
      operationId: encuestas_rh_create_pregunta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Pregunta creada, content: { application/json: { schema: { type: object } } } }
        "409": { description: La encuesta no esta en borrador }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/preguntas/reordenar:
    put:
      tags: [Talento - Encuestas RH]
      summary: Reordenar preguntas de una encuesta en borrador
      operationId: encuestas_rh_reordenar_preguntas
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pregunta_ids]
              properties:
                pregunta_ids: { type: array, items: { type: integer }, description: "Ids de pregunta en el nuevo orden deseado" }
      responses:
        "200": { description: Preguntas reordenadas, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "422": { description: pregunta_ids no cubre exactamente las preguntas existentes }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/preguntas/{pregunta_id}:
    put:
      tags: [Talento - Encuestas RH]
      summary: Actualizar pregunta (solo en borrador; opciones se reemplazan por completo si se envian)
      operationId: encuestas_rh_update_pregunta
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: encuesta_id, in: path, required: true, schema: { type: integer } }
        - { name: pregunta_id, in: path, required: true, schema: { type: integer } }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Pregunta actualizada, content: { application/json: { schema: { type: object } } } }
        "409": { description: La encuesta no esta en borrador }
    delete:
      tags: [Talento - Encuestas RH]
      summary: Eliminar pregunta (solo en borrador)
      operationId: encuestas_rh_delete_pregunta
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: encuesta_id, in: path, required: true, schema: { type: integer } }
        - { name: pregunta_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Pregunta eliminada }
        "409": { description: La encuesta no esta en borrador }
  /api/v1/encuestas-rh/audiencia/turnos:
    get:
      tags: [Talento - Encuestas RH]
      summary: Catalogo de turnos distintos (normalizados) de empleados activos, para el selector de audiencia
      operationId: encuestas_rh_list_turnos
      security: [ { BearerAuth: [] } ]
      responses:
        "200": { description: Turnos distintos ordenados alfabeticamente, content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /api/v1/encuestas-rh/audiencia/preview:
    get:
      tags: [Talento - Encuestas RH]
      summary: Preview de audiencia por area/turno/rol (conteos, sin materializar)
      operationId: encuestas_rh_preview_audiencia
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: areas, in: query, required: false, schema: { type: array, items: { type: integer } }, style: form, explode: true, description: "Repetido o separado por comas" }
        - { name: turnos, in: query, required: false, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: roles, in: query, required: false, schema: { type: array, items: { type: string } }, style: form, explode: true }
      responses:
        "200": { description: Preview de audiencia (total, por_area, por_turno), content: { application/json: { schema: { type: object } } } }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/publicar:
    post:
      tags: [Talento - Encuestas RH]
      summary: Publicar encuesta (materializa audiencia, notifica participantes)
      operationId: encuestas_rh_publicar_encuesta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Encuesta publicada, content: { application/json: { schema: { type: object } } } }
        "409": { description: Solo encuestas en borrador se pueden publicar }
        "422": { description: Preguntas/opciones/fecha/audiencia invalida }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/cerrar:
    post:
      tags: [Talento - Encuestas RH]
      summary: Cerrar encuesta manualmente
      operationId: encuestas_rh_cerrar_encuesta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Encuesta cerrada, content: { application/json: { schema: { type: object } } } }
        "409": { description: Solo encuestas publicadas se pueden cerrar }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/participantes:
    get:
      tags: [Talento - Encuestas RH]
      summary: Listar participantes (empleado, estado, fecha de respuesta) — nunca incluye respuestas individuales
      operationId: encuestas_rh_list_participantes
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Participantes, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/recordatorios:
    post:
      tags: [Talento - Encuestas RH]
      summary: Forzar recordatorio manual a todos los participantes pendientes
      description: >
        Envía un recordatorio a TODOS los participantes en estado `pendiente` de la
        encuesta, sin respetar la cadencia `recordatorio_cada_dias` (esa cadencia solo
        aplica al job automático diario que corre `procesar_recordatorios`). Actualiza
        `ultimo_recordatorio_at` e incrementa `recordatorios_enviados` de cada
        participante notificado. Requiere que la encuesta esté publicada.
      operationId: encuestas_rh_forzar_recordatorios
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Recordatorios enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  recordatorios_enviados: { type: integer }
        "404": { description: Encuesta no encontrada }
        "409": { description: Solo encuestas publicadas admiten recordatorios }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/resultados:
    get:
      tags: [Talento - Encuestas RH]
      summary: Resumen global de resultados (tasa, n, metricas por pregunta o oculto_global)
      description: >
        Regla min-N: en encuestas anonimas, si el total de respuestas (n) es
        menor al umbral configurado, `oculto_global=true` y `preguntas` viene
        vacio (sin metricas ni textos). En encuestas nominales el global
        nunca se oculta. Solo disponible con la encuesta publicada o cerrada.
      operationId: encuestas_rh_resultados_globales
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Resultados globales, content: { application/json: { schema: { type: object } } } }
        "404": { description: Encuesta no encontrada }
        "409": { description: La encuesta esta en borrador (aun no tiene resultados) }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/resultados/segmentos:
    get:
      tags: [Talento - Encuestas RH]
      summary: Resultados agregados por segmento (area/turno/clasificacion), min-N aplicado por celda
      description: >
        Toda celda con n < umbral se devuelve como `{segmento, n, oculto:
        true}` sin metricas, tanto en encuestas anonimas como nominales.
        Los valores NULL del snapshot se agrupan como "Sin dato".
      operationId: encuestas_rh_resultados_segmentos
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: encuesta_id, in: path, required: true, schema: { type: integer } }
        - { name: dimension, in: query, required: true, schema: { type: string, enum: [area, turno, clasificacion] } }
      responses:
        "200": { description: Resultados por segmento, content: { application/json: { schema: { type: object } } } }
        "404": { description: Encuesta no encontrada }
        "409": { description: La encuesta esta en borrador (aun no tiene resultados) }
        "422": { description: dimension invalida }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/resultados/textos:
    get:
      tags: [Talento - Encuestas RH]
      summary: Textos abiertos de una pregunta tipo texto (barajados, sin orden ni fecha)
      description: >
        En encuestas anonimas solo se devuelven si el global pasa la regla
        min-N (`oculto=false`); en nominales siempre se devuelven.
      operationId: encuestas_rh_resultados_textos
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: encuesta_id, in: path, required: true, schema: { type: integer } }
        - { name: pregunta_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Textos de la pregunta, content: { application/json: { schema: { type: object } } } }
        "404": { description: Encuesta o pregunta no encontrada }
        "409": { description: La encuesta esta en borrador (aun no tiene resultados) }
        "422": { description: La pregunta no es de tipo texto }
  /api/v1/encuestas-rh/encuestas/{encuesta_id}/export/excel:
    get:
      tags: [Talento - Encuestas RH]
      summary: Exportar resultados a Excel (Resumen, Preguntas, Segmentos, Textos)
      description: >
        Aplica la misma regla min-N que los endpoints de resultados (el
        export nunca expone metricas ni textos de una celda/global oculta).
        Nombre de archivo con slug del titulo de la encuesta.
      operationId: encuestas_rh_export_resultados_excel
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Archivo .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "404": { description: Encuesta no encontrada }
        "409": { description: La encuesta esta en borrador (aun no tiene resultados) }
  /api/v1/encuestas-rh/plantillas:
    get:
      tags: [Talento - Encuestas RH]
      summary: Listar plantillas reutilizables de encuesta
      operationId: encuestas_rh_list_plantillas
      security: [ { BearerAuth: [] } ]
      responses:
        "200": { description: Plantillas, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /api/v1/encuestas-rh/plantillas/{plantilla_id}/crear-encuesta:
    post:
      tags: [Talento - Encuestas RH]
      summary: Crear encuesta en borrador a partir de una plantilla
      description: >
        `es_anonima` es explícito y obligatorio en el body (no se depende del
        default silencioso del service).
      operationId: encuestas_rh_crear_encuesta_desde_plantilla
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: plantilla_id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [es_anonima]
              properties:
                es_anonima: { type: boolean }
      responses:
        "201": { description: Encuesta creada desde plantilla, content: { application/json: { schema: { type: object } } } }
        "404": { description: Plantilla no encontrada }
  /api/v1/encuestas-rh/mis-encuestas:
    get:
      tags: [Talento - Encuestas RH]
      summary: Mis encuestas (self-service; empleado_id del token)
      operationId: encuestas_rh_mis_encuestas
      security: [ { BearerAuth: [] } ]
      responses:
        "200": { description: Encuestas donde el empleado autenticado participa, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /api/v1/encuestas-rh/mis-encuestas/{encuesta_id}:
    get:
      tags: [Talento - Encuestas RH]
      summary: Detalle de encuesta para responder (self-service)
      operationId: encuestas_rh_mi_encuesta_detalle
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Encuesta con preguntas, content: { application/json: { schema: { type: object } } } }
        "403": { description: No eres participante de esta encuesta }
  /api/v1/encuestas-rh/mis-encuestas/{encuesta_id}/responder:
    post:
      tags: [Talento - Encuestas RH]
      summary: Responder encuesta (self-service; empleado_id siempre del token, se ignora cualquier valor del body)
      operationId: encuestas_rh_responder
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: encuesta_id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "204": { description: Respuesta registrada }
        "403": { description: No eres participante de esta encuesta }
        "409": { description: Ya respondiste esta encuesta / encuesta no publicada }
        "422": { description: Respuesta invalida (rango likert, opcion de otra pregunta, requerida faltante, etc.) }

  /api/v1/metas/ciclos:
    get:
      tags: [Talento - Metas]
      summary: Listar ciclos de metas (filtro opcional por estado)
      operationId: metas_list_ciclos
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [borrador, activo, cerrado] } }
      responses:
        "200": { description: Ciclos, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [Talento - Metas]
      summary: Crear ciclo de metas en borrador (creado_por_id se toma del token, no del body)
      operationId: metas_create_ciclo
      security: [ { BearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Ciclo creado, content: { application/json: { schema: { type: object } } } }
  /api/v1/metas/ciclos/{ciclo_id}:
    get:
      tags: [Talento - Metas]
      summary: Detalle de ciclo de metas
      operationId: metas_get_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Ciclo, content: { application/json: { schema: { type: object } } } }
        "404": { description: Ciclo no encontrado }
    put:
      tags: [Talento - Metas]
      summary: Editar nombre/descripcion/fechas de un ciclo en borrador o activo (bloqueado si esta cerrado)
      operationId: metas_update_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Ciclo actualizado, content: { application/json: { schema: { type: object } } } }
        "404": { description: Ciclo no encontrado }
        "409": { description: No se puede editar un ciclo cerrado }
        "422": { description: fecha_fin menor a fecha_inicio }
  /api/v1/metas/ciclos/{ciclo_id}/activar:
    post:
      tags: [Talento - Metas]
      summary: Activar ciclo (borrador -> activo; habilita crear/editar metas)
      operationId: metas_activar_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Ciclo activado, content: { application/json: { schema: { type: object } } } }
        "409": { description: Solo ciclos en borrador se pueden activar }
  /api/v1/metas/ciclos/{ciclo_id}/cerrar:
    post:
      tags: [Talento - Metas]
      summary: Cerrar ciclo (congela metas de equipo; exige metas individuales ya calificadas)
      operationId: metas_cerrar_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Ciclo cerrado, content: { application/json: { schema: { type: object } } } }
        "409": { description: Solo ciclos activos se pueden cerrar / hay metas individuales sin calificar }
  /api/v1/metas/ciclos/{ciclo_id}/recordatorios:
    post:
      tags: [Talento - Metas]
      summary: Forzar recordatorios manuales del ciclo (ignora las ventanas del job diario)
      description: >
        Envia un recordatorio (NotificacionService, canal in_app, target_url
        "#/talento/mis-metas") a todos los empleados con metas individuales
        pendientes (no cerradas) del ciclo, sin evaluar `dias_cierre` ni
        `dias_sin_checkin` (a diferencia del job diario
        `MetasService.procesar_recordatorios`). Metas de equipo y metas ya
        cerradas nunca notifican.
      operationId: metas_forzar_recordatorios_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Recordatorios enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificados: { type: integer, description: "Empleados distintos notificados" }
        "404": { description: Ciclo no encontrado }
  /api/v1/metas/metas:
    get:
      tags: [Talento - Metas]
      summary: Listar metas (RH global por modulo; jefe con scoping por equipo via lider_id)
      description: >
        Jefes (supervisor/gerente, o RH/admin en Modo lider/gerente) solo ven
        metas de su equipo (reportes directos, o metas de equipo donde
        lider_id es el propio jefe); RH con el modulo 'metas' concedido
        (modo operativo) ve todas.
      operationId: metas_list_metas
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: ciclo_id, in: query, required: false, schema: { type: integer } }
        - { name: empleado_id, in: query, required: false, schema: { type: integer } }
        - { name: nivel, in: query, required: false, schema: { type: string, enum: [individual, equipo] } }
      responses:
        "200": { description: Metas, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "403": { description: Empleado fuera del equipo del jefe }
    post:
      tags: [Talento - Metas]
      summary: Crear meta (asignada_por_id se toma del token; scoping por equipo para jefes)
      operationId: metas_create_meta
      security: [ { BearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Meta creada, content: { application/json: { schema: { type: object } } } }
        "403": { description: Empleado/lider fuera del equipo del jefe }
        "422": { description: Datos de meta invalidos (nivel/empleado_id/area_id/lider_id/meta_padre_id) }
  /api/v1/metas/metas/{meta_id}:
    get:
      tags: [Talento - Metas]
      summary: Detalle de meta (con resultados clave)
      operationId: metas_get_meta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: meta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Meta, content: { application/json: { schema: { type: object } } } }
        "403": { description: Meta fuera del equipo del jefe }
        "404": { description: Meta no encontrada }
    put:
      tags: [Talento - Metas]
      summary: Actualizar meta (bloqueado si el ciclo no esta activo o la meta esta cerrada)
      operationId: metas_update_meta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: meta_id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Meta actualizada, content: { application/json: { schema: { type: object } } } }
        "403": { description: Meta fuera del equipo del jefe }
        "409": { description: Ciclo no activo o meta cerrada }
    delete:
      tags: [Talento - Metas]
      summary: Eliminar meta (solo si no tiene check-ins en ninguno de sus resultados clave)
      operationId: metas_delete_meta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: meta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "204": { description: Meta eliminada }
        "403": { description: Meta fuera del equipo del jefe }
        "409": { description: La meta tiene check-ins }
  /api/v1/metas/metas/{meta_id}/cerrar:
    post:
      tags: [Talento - Metas]
      summary: Cerrar meta con calificacion (0-100) y comentario opcional del jefe
      operationId: metas_cerrar_meta
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: meta_id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calificacion]
              properties:
                calificacion: { type: number, minimum: 0, maximum: 100 }
                comentario: { type: string, nullable: true }
      responses:
        "200": { description: Meta cerrada, content: { application/json: { schema: { type: object } } } }
        "403": { description: Meta fuera del equipo del jefe }
        "409": { description: Ciclo no activo o meta ya cerrada }
        "422": { description: Calificacion fuera de rango }
  /api/v1/metas/metas/{meta_id}/resultados:
    post:
      tags: [Talento - Metas]
      summary: Agregar resultado clave a una meta
      operationId: metas_create_resultado
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: meta_id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Resultado clave creado, content: { application/json: { schema: { type: object } } } }
        "403": { description: Meta fuera del equipo del jefe }
        "409": { description: Ciclo no activo o meta cerrada }
        "422": { description: valor_objetivo igual a valor_inicial (salvo tipo booleano) }
  /api/v1/metas/metas/{meta_id}/resultados/{rc_id}:
    put:
      tags: [Talento - Metas]
      summary: Actualizar resultado clave
      operationId: metas_update_resultado
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: meta_id, in: path, required: true, schema: { type: integer } }
        - { name: rc_id, in: path, required: true, schema: { type: integer } }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Resultado clave actualizado, content: { application/json: { schema: { type: object } } } }
        "403": { description: Meta fuera del equipo del jefe }
        "404": { description: El resultado clave no pertenece a la meta }
        "409": { description: Ciclo no activo o meta cerrada }
    delete:
      tags: [Talento - Metas]
      summary: Eliminar resultado clave (solo si no tiene check-ins)
      operationId: metas_delete_resultado
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: meta_id, in: path, required: true, schema: { type: integer } }
        - { name: rc_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Resultado clave eliminado }
        "403": { description: Meta fuera del equipo del jefe }
        "404": { description: El resultado clave no pertenece a la meta }
        "409": { description: El resultado clave tiene check-ins }
  /api/v1/metas/resultados/{rc_id}/checkin:
    post:
      tags: [Talento - Metas]
      summary: Ajuste de avance por el jefe (check-in con es_ajuste_jefe=true)
      operationId: metas_ajuste_checkin
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: rc_id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valor]
              properties:
                valor: { type: number }
                nota: { type: string, nullable: true }
      responses:
        "201": { description: Check-in registrado, content: { application/json: { schema: { type: object } } } }
        "403": { description: Resultado clave fuera del equipo del jefe }
        "404": { description: Resultado clave no encontrado }
        "409": { description: Ciclo no activo o meta cerrada }
  /api/v1/metas/equipo/avance:
    get:
      tags: [Talento - Metas]
      summary: Tablero de avance del equipo del jefe (o del ciclo completo para RH global)
      description: >
        Agrupado por miembro (`miembros[]`: empleado_id, empleado_nombre,
        sus metas individuales del ciclo con avance derivado, y
        `avance_global` = promedio ponderado por peso del avance de esas
        metas). Las metas de nivel "equipo" (lider_id, sin empleado_id) van
        aparte en `metas_equipo` con su avance ya resuelto (roll-up de
        submetas si no tienen resultados clave propios).
      operationId: metas_equipo_avance
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: ciclo_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Tablero de equipo agrupado por miembro
          content:
            application/json:
              schema:
                type: object
                properties:
                  ciclo_id: { type: integer }
                  miembros:
                    type: array
                    items:
                      type: object
                      properties:
                        empleado_id: { type: integer }
                        empleado_nombre: { type: string, nullable: true }
                        metas: { type: array, items: { type: object } }
                        avance_global: { type: number }
                  metas_equipo: { type: array, items: { type: object } }
  /api/v1/metas/empleados/{empleado_id}/cumplimiento:
    get:
      tags: [Talento - Metas]
      summary: Cumplimiento ponderado (peso x calificacion) de metas cerradas del empleado en el ciclo
      operationId: metas_cumplimiento_empleado
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: empleado_id, in: path, required: true, schema: { type: integer } }
        - { name: ciclo_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Cumplimiento ponderado, content: { application/json: { schema: { type: object } } } }
        "403": { description: Empleado fuera del equipo del jefe }
  /api/v1/metas/ciclos/{ciclo_id}/export/excel:
    get:
      tags: [Talento - Metas]
      summary: Exportar a Excel las metas del ciclo (mismo scoping de equipo que la gestion)
      description: >
        Una hoja ("Metas y avance") con: empleado (o "Equipo (líder N)"),
        meta, nivel, estado, peso, avance % derivado, calificación de cierre
        y cumplimiento ponderado del empleado (columna vacía en filas de
        metas de equipo; 0 mientras la meta no esté cerrada/calificada). El
        jefe solo exporta las metas de su equipo; RH con el módulo 'metas'
        exporta el ciclo completo.
      operationId: metas_export_ciclo_excel
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Archivo .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "404": { description: Ciclo no encontrado }
  /api/v1/metas/mis-metas:
    get:
      tags: [Talento - Metas]
      summary: Mis metas (self-service; empleado_id del token)
      operationId: metas_mis_metas
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: ciclo_id, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: Metas asignadas al empleado autenticado, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /api/v1/metas/mis-metas/{meta_id}:
    get:
      tags: [Talento - Metas]
      summary: Detalle de una meta propia (self-service)
      operationId: metas_mi_meta_detalle
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: meta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Meta, content: { application/json: { schema: { type: object } } } }
        "404": { description: Meta no encontrada o no pertenece al empleado }
  /api/v1/metas/mis-metas/resultados/{rc_id}/checkin:
    post:
      tags: [Talento - Metas]
      summary: Check-in propio de un resultado clave (self-service; empleado_id siempre del token, se ignora cualquier valor del body)
      operationId: metas_mi_checkin
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: rc_id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valor]
              properties:
                valor: { type: number }
                nota: { type: string, nullable: true }
      responses:
        "201": { description: Check-in registrado, content: { application/json: { schema: { type: object } } } }
        "404": { description: Resultado clave no encontrado o no pertenece al empleado }
        "409": { description: Ciclo no activo o meta cerrada }

  /api/v1/ciclo-desempeno/ciclos:
    get:
      tags: [Talento - Ciclo de Desempeño]
      summary: Listar ciclos de desempeño (RH global por módulo; jefe con scoping de equipo)
      operationId: ciclo_desempeno_list_ciclos
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [borrador, activo, cerrado] } }
      responses:
        "200": { description: Ciclos, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [Talento - Ciclo de Desempeño]
      summary: Crear ciclo de desempeño en borrador (creado_por_id se toma del token, no del body; solo RH con módulo)
      operationId: ciclo_desempeno_create_ciclo
      security: [ { BearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Ciclo creado, content: { application/json: { schema: { type: object } } } }
        "422": { description: Fechas/pesos/umbrales inválidos }
  /api/v1/ciclo-desempeno/ciclos/{ciclo_id}:
    get:
      tags: [Talento - Ciclo de Desempeño]
      summary: Detalle de ciclo de desempeño
      operationId: ciclo_desempeno_get_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Ciclo, content: { application/json: { schema: { type: object } } } }
        "404": { description: Ciclo no encontrado }
    put:
      tags: [Talento - Ciclo de Desempeño]
      summary: Editar un ciclo en borrador (todos los campos) (solo RH con módulo)
      operationId: ciclo_desempeno_update_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Ciclo actualizado, content: { application/json: { schema: { type: object } } } }
        "404": { description: Ciclo no encontrado }
        "409": { description: Solo se puede editar un ciclo en borrador }
        "422": { description: Fechas/pesos/umbrales inválidos }
  /api/v1/ciclo-desempeno/ciclos/{ciclo_id}/activar:
    post:
      tags: [Talento - Ciclo de Desempeño]
      summary: Activar ciclo (borrador -> activo; materializa resultados = metas individuales ∪ participantes 360 vinculados)
      operationId: ciclo_desempeno_activar_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200": { description: Ciclo activado, content: { application/json: { schema: { type: object } } } }
        "409": { description: Solo ciclos en borrador se pueden activar }
        "422": { description: Falta periodo, pesos en 0, o ninguna señal (meta_ciclo_id/eval360_campana_id) vinculada }
  /api/v1/ciclo-desempeno/ciclos/{ciclo_id}/cerrar:
    post:
      tags: [Talento - Ciclo de Desempeño]
      summary: Cerrar ciclo (congela snapshot de calificación/bandas/segmento por empleado)
      description: >
        Exige que las fuentes vinculadas estén estables (meta_ciclo en estado
        "cerrado"; campaña 360 en "finalizada"/"cerrada") salvo que el body
        envíe `forzar: true` (override puntual de quien ejecuta el cierre).
      operationId: ciclo_desempeno_cerrar_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                forzar: { type: boolean, default: false }
      responses:
        "200": { description: Ciclo cerrado, content: { application/json: { schema: { type: object } } } }
        "409": { description: Solo ciclos activos se pueden cerrar }
        "422": { description: Meta_ciclo vinculado no cerrado o campaña 360 vinculada no finalizada (sin forzar) }
  /api/v1/ciclo-desempeno/ciclos/{ciclo_id}/resultados:
    get:
      tags: [Talento - Ciclo de Desempeño]
      summary: Resultados del ciclo por empleado (scoping de equipo; en vivo mientras el ciclo no esté cerrado, snapshot si ya cerró)
      operationId: ciclo_desempeno_resultados_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } }, { name: area_id, in: query, required: false, schema: { type: integer }, description: "Recorta al área; nunca amplía el scope del jefe" } ]
      responses:
        "200": { description: Resultados (filtrados por el scope del jefe; vacío si ninguno cae en su equipo), content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "404": { description: Ciclo no encontrado }
  /api/v1/ciclo-desempeno/ciclos/{ciclo_id}/9box:
    get:
      tags: [Talento - Ciclo de Desempeño]
      summary: Matriz 9-Box del ciclo (9 celdas banda_desempeno x banda_potencial, scoping de equipo)
      operationId: ciclo_desempeno_nueve_box
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } }, { name: area_id, in: query, required: false, schema: { type: integer }, description: "Recorta al área; nunca amplía el scope del jefe" } ]
      responses:
        "200": { description: Matriz 9-Box, content: { application/json: { schema: { type: object } } } }
        "404": { description: Ciclo no encontrado }
  /api/v1/ciclo-desempeno/ciclos/{ciclo_id}/potencial:
    put:
      tags: [Talento - Ciclo de Desempeño]
      summary: Capturar potencial (0-100) en batch para empleados del ciclo (scoping de equipo)
      operationId: ciclo_desempeno_set_potencial
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [empleado_id, potencial]
                    properties:
                      empleado_id: { type: integer }
                      potencial: { type: number, minimum: 0, maximum: 100 }
      responses:
        "200": { description: Resultados con potencial/banda/segmento actualizados, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "403": { description: Empleado fuera del scope del jefe }
        "404": { description: Ciclo o resultado de empleado no encontrado }
        "409": { description: Solo se puede capturar potencial en un ciclo activo }
  /api/v1/ciclo-desempeno/ciclos/{ciclo_id}/calibracion:
    put:
      tags: [Talento - Ciclo de Desempeño]
      summary: Calibrar bandas de desempeño (override directo, solo RH global)
      description: >
        Aplica overrides de banda de desempeño por empleado (calibración
        corporativa). Exclusivo de RH con alcance global: un jefe de equipo
        (scope != None) recibe 403. Por item, `banda_ajustada=null` revierte
        el override; una banda válida requiere `motivo` no vacío. Recompone
        `segmento_9box` con la banda efectiva. Exige ciclo activo.
      operationId: ciclo_desempeno_calibrar_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalibracionRequest" }
      responses:
        "200":
          description: Resultados con banda ajustada/efectiva y segmento recompuestos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CicloDesempenoResultadoResponse" } }
        "403": { description: La calibración es exclusiva de RH (alcance global) }
        "404": { description: Ciclo o resultado de empleado no encontrado }
        "409": { description: Solo se puede calibrar un ciclo activo }
        "422": { description: Banda inválida o motivo vacío al fijar un override }
  /api/v1/ciclo-desempeno/ciclos/{ciclo_id}/distribucion:
    get:
      tags: [Talento - Ciclo de Desempeño]
      summary: Distribución de bandas efectivas vs. objetivo (scoping de equipo)
      description: >
        Cuenta las bandas de desempeño efectivas del ciclo (scope aplicado)
        y las compara con la distribución objetivo (config del ciclo o
        default bajo/medio/alto). `desviacion` = pct actual - objetivo por
        banda.
      operationId: ciclo_desempeno_distribucion_ciclo
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } }, { name: area_id, in: query, required: false, schema: { type: integer }, description: "Recorta al área; nunca amplía el scope del jefe" } ]
      responses:
        "200":
          description: Distribución actual, objetivo y desviación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistribucionResponse" }
        "404": { description: Ciclo no encontrado }
  /api/v1/ciclo-desempeno/ciclos/{ciclo_id}/export/excel:
    get:
      tags: [Talento - Ciclo de Desempeño]
      summary: Exportar a Excel los resultados del ciclo (mismo scoping de equipo que la gestión)
      operationId: ciclo_desempeno_export_ciclo_excel
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: ciclo_id, in: path, required: true, schema: { type: integer } }, { name: area_id, in: query, required: false, schema: { type: integer }, description: "Recorta al área; nunca amplía el scope del jefe" } ]
      responses:
        "200":
          description: Archivo .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "404": { description: Ciclo no encontrado }
  /api/v1/ciclo-desempeno/mis-resultados:
    get:
      tags: [Talento - Ciclo de Desempeño]
      summary: Mis resultados (self-service; empleado_id del token, solo ciclos cerrados)
      operationId: ciclo_desempeno_mis_resultados
      security: [ { BearerAuth: [] } ]
      responses:
        "200": { description: Resultados propios en ciclos ya cerrados (vacío si no hay), content: { application/json: { schema: { type: array, items: { type: object } } } } }

  /api/v1/historial-objetivo/empleados/{empleado_id}:
    get:
      tags: [Cumplimiento - Historial Objetivo]
      summary: Índice objetivo (0-100) + semáforo + desglose por fuente de un empleado (scoped)
      description: >
        Combina actas administrativas + faltas/retardos e incidencias
        (Bono) en un solo índice 0-100 con semáforo (rojo/amarillo/verde) y
        desglose de penalización por fuente (actas, faltas, incidencias,
        progresivo). Scoping resuelto por el service
        (`empleado_ids_scope_por_modulo`): RH con el módulo
        'historial-objetivo' o director ven a cualquier empleado; jefe
        (supervisor/gerente) solo a su equipo. Si `fecha_inicio`/`fecha_fin`
        se omiten, la API aplica un default de "últimos 12 meses"
        (hoy - 365 días / hoy).
      operationId: historial_objetivo_indice_empleado
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: empleado_id, in: path, required: true, schema: { type: integer } }
        - { name: fecha_inicio, in: query, required: false, schema: { type: string, format: date } }
        - { name: fecha_fin, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: Índice objetivo del empleado, content: { application/json: { schema: { type: object } } } }
        "403": { description: Empleado fuera del alcance del jefe }
        "404": { description: Empleado no encontrado }
        "422": { description: fecha_inicio posterior a fecha_fin }
  /api/v1/historial-objetivo/equipo:
    get:
      tags: [Cumplimiento - Historial Objetivo]
      summary: Ranking de índice objetivo del equipo (peor índice primero)
      description: >
        RH con el módulo 'historial-objetivo' (o director) ve el universo
        acotado a "top offenders" (empleados con al menos un evento en
        actas/faltas/incidencias en el rango, tope 500); jefe
        (supervisor/gerente) ve a todo su equipo (incluye empleados con
        historial limpio, índice 100). Mismo default de rango de fechas
        (últimos 12 meses) que `GET /empleados/{empleado_id}`.
      operationId: historial_objetivo_indice_equipo
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: fecha_inicio, in: query, required: false, schema: { type: string, format: date } }
        - { name: fecha_fin, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: Ranking de equipo, content: { application/json: { schema: { type: object } } } }
        "422": { description: fecha_inicio posterior a fecha_fin }
  /api/v1/historial-objetivo/equipo/export:
    get:
      tags: [Cumplimiento - Historial Objetivo]
      summary: Exportar a Excel el ranking de equipo (mismo scoping que GET /equipo)
      operationId: historial_objetivo_export_equipo_excel
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: fecha_inicio, in: query, required: false, schema: { type: string, format: date } }
        - { name: fecha_fin, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: Archivo .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /api/v1/historial-objetivo/mi-historial:
    get:
      tags: [Cumplimiento - Historial Objetivo]
      summary: Mi índice objetivo (self-service; empleado_id del token)
      operationId: historial_objetivo_mi_historial
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: fecha_inicio, in: query, required: false, schema: { type: string, format: date } }
        - { name: fecha_fin, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: Índice objetivo del empleado autenticado, content: { application/json: { schema: { type: object } } } }

  /api/v1/juntas:
    get:
      tags: [Juntas]
      summary: Listar juntas (paginado, búsqueda)
      operationId: juntas_list
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 10 } }
        - { name: q, in: query, required: false, schema: { type: string }, description: Búsqueda por nombre de la junta }
        - { name: categoria, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Listado paginado de juntas
          content: { application/json: { schema: { $ref: '#/components/schemas/JuntaListResponse' } } }
    post:
      tags: [Juntas]
      summary: Crear junta con sus asistentes
      operationId: juntas_create
      security: [ { BearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JuntaCreate' } } }
      responses:
        "201":
          description: Junta creada (con detalle y asistentes)
          content: { application/json: { schema: { $ref: '#/components/schemas/JuntaDetalleResponse' } } }
        "422": { description: Validación (nombre < 3 caracteres, etc.) }
  /api/v1/juntas/{junta_id}:
    get:
      tags: [Juntas]
      summary: Detalle de una junta con la lista completa de asistentes
      operationId: juntas_get
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: junta_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Detalle de la junta
          content: { application/json: { schema: { $ref: '#/components/schemas/JuntaDetalleResponse' } } }
        "404": { description: Junta no encontrada }

  # ── Proveedores externos (capacitación de personal externo) ──────────
  /api/v1/proveedores-externos/proveedores:
    get:
      tags: [Proveedores externos]
      summary: Listar proveedores (paginado, búsqueda)
      operationId: proveedores_externos_list
      security: [ { BearerAuth: [] } ]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 50 } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: activo, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: Listado paginado de proveedores
          content: { application/json: { schema: { $ref: '#/components/schemas/ProveedorListResponse' } } }
    post:
      tags: [Proveedores externos]
      summary: Crear proveedor
      operationId: proveedores_externos_create
      security: [ { BearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProveedorCreate' } } }
      responses:
        "201":
          description: Proveedor creado
          content: { application/json: { schema: { $ref: '#/components/schemas/ProveedorDetalleResponse' } } }
  /api/v1/proveedores-externos/proveedores/{proveedor_id}:
    get:
      tags: [Proveedores externos]
      summary: Detalle de proveedor con sus personas
      operationId: proveedores_externos_get
      security: [ { BearerAuth: [] } ]
      parameters: [ { name: proveedor_id, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: Detalle del proveedor
          content: { application/json: { schema: { $ref: '#/components/schemas/ProveedorDetalleResponse' } } }
        "404": { description: Proveedor no encontrado }
    put:
      tags: [Proveedores externos]
      summary: Actualizar proveedor
      operationId: proveedores_externos_update
