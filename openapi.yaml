        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilCompetenciaSyncBody"
      responses:
        "200":
          description: Lista actualizada de competencias del perfil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerfilCompetenciaResponse"
