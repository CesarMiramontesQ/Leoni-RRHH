        tabla interna `incidencias`. Los roles RH y director ven el universo completo;
        gerente y supervisor solo su equipo. Excluye tipos internos `progresivo` y
        `progresivo_historico`.
      operationId: incidencias_list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
        - name: tipo
          in: query
          required: false
          description: Coincide exactamente con la columna tipo.
          schema:
            type: string
        - name: empleado_id
          in: query
          required: false
          schema:
            type: integer
        - name: no_empleado
          in: query
          required: false
          schema:
            type: string
        - name: nombre
          in: query
          required: false
          schema:
            type: string
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: categoria
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: subarea
          in: query
          required: false
          schema:
            type: string
        - name: fecha_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: fecha_fin
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Página de incidencias y resumen KPI filtrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidenciasListPageResponse"
    post:
      tags: [Incidencias]
      summary: Registrar incidencia
      description: En desarrollo.
      operationId: incidencias_create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidenciaCreate"
      responses:
        "200":
          description: Incidencia registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

