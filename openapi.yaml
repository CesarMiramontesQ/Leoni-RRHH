  # ── Solicitudes ─────────────────────────────────────
  /api/v1/solicitudes:
    get:
      tags: [Solicitudes]
      summary: Listar solicitudes (cursor-based)
      operationId: solicitudes_list
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: ID del ultimo item recibido; omitir para primera pagina
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: X-RH-UI-Mode
          in: header
          required: false
          description: >
            Modo UI activo para usuarios RH. `operativo`: vista RH (módulos asignados o acceso
            completo si el puesto tiene capacidad gestor). `empleado`: autoservicio personal.
            `lider` / `gerente`: vista de equipo (solo si el JWT incluye `rh_gestor_alcance`
            supervisor o gerente). Afecta alcance de listados, aprobaciones y permisos efectivos.
          schema:
            type: string
            enum: [operativo, empleado, lider, gerente]
      responses:
        "200":
          description: Pagina de solicitudes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSolicitudResponse"
    post:
      tags: [Solicitudes]
      summary: Crear solicitud
      operationId: solicitudes_create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudCreate"
      responses:
        "201":
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudResponse"
        "422":
          description: Error de validacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /api/v1/solicitudes/{solicitud_id}:
    get:
      tags: [Solicitudes]
      summary: Detalle de solicitud
      operationId: solicitudes_get
