            type: integer
        - name: asignacion_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grado_id:
                  type: integer
                  minimum: 1
                departamento:
                  type: string
                  maxLength: 200
      responses:
