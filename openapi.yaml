      operationId: evaluaciones_list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
        - name: empleado_id
          in: query
          schema: { type: integer }
        - name: competencia_id
          in: query
          schema: { type: integer }
        - name: area_id
          in: query
          schema: { type: integer }
        - name: estado
          in: query
          description: Filtrar por estado(s), separados por coma
          schema: { type: string }
      responses:
        "200":
          description: Lista paginada de evaluaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluacionListResponse"
    post:
      tags: [Talento - Evaluaciones]
      summary: Crear/actualizar evaluacion (upsert)
      description: Empleado (autoevaluacion), supervisor (su area), RH (cualquiera). Si ya existe evaluacion cerrada para el par empleado+competencia, la reabre como borrador.
      operationId: evaluaciones_create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluacionCreate"
      responses:
        "201":
          description: Evaluacion creada/actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluacionResponse"
        "403":
          description: Sin permiso (empleado o supervisor fuera de su area)
        "404":
          description: Empleado o competencia no encontrado

  /api/v1/evaluaciones/{id}:
    get:
      tags: [Talento - Evaluaciones]
      summary: Detalle de evaluacion
      operationId: evaluaciones_get
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Evaluacion encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluacionResponse"
        "404":
          description: Evaluacion no encontrada
    put:
      tags: [Talento - Evaluaciones]
      summary: Actualizar evaluacion
      description: Solo en estados editables segun rol. Borrador/devuelto para empleado; en_revision para supervisor/RH.
      operationId: evaluaciones_update
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluacionUpdate"
      responses:
        "200":
          description: Evaluacion actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluacionResponse"
        "403":
          description: Sin permiso
        "404":
          description: Evaluacion no encontrada
    delete:
      tags: [Talento - Evaluaciones]
      summary: Eliminar evaluacion
      description: Solo en estado borrador.
      operationId: evaluaciones_delete
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Evaluacion eliminada
        "403":
          description: Sin permiso (solo RH)
        "404":
          description: Evaluacion no encontrada

