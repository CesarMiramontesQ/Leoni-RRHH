    # ── Comedor ───────────────────────────────────────
    ComedorJornadaComidaItem:
      type: object
      required: [ho_codigo, descripcion, activo, turnos, en_catalogo]
      properties:
        ho_codigo:
          type: string
          description: Codigo de la jornada de TRESS, ya normalizado
        descripcion:
          type: string
        hora_entrada:
          type: [string, "null"]
          format: time
          description: >-
            Entrada de la jornada (HO_INTIME). Puede ser mayor que la salida.
            hay jornadas que cruzan medianoche, como 18.00 a 06.00.
        hora_salida:
          type: [string, "null"]
          format: time
        jornada_horas:
          type: [number, "null"]
        activo:
          type: boolean
        hora_inicio_comida:
          type: [string, "null"]
          format: time
          description: HH:MM:SS; null cuando la jornada aun no tiene ventana de comida
        hora_fin_comida:
          type: [string, "null"]
          format: time
        actualizado_en:
          type: [string, "null"]
          format: date-time
        turnos:
          type: array
          items:
            type: string
          description: Turnos que recorren esta jornada. el alcance de editarla
        empleados_activos:
          type: [integer, "null"]
          description: >-
            Personal de esos turnos segun la cache levelup_turnos_uso.
            null = la cache nunca se ha sincronizado (distinto de 0 empleados).
        en_catalogo:
          type: boolean
          description: false = un turno la referencia pero no esta en la replica

    ComedorJornadaComidaUpsert:
      type: object
      required: [hora_inicio_comida, hora_fin_comida]
      properties:
        hora_inicio_comida:
          type: string
          format: time
          description: HH:MM o HH:MM:SS en formato de 24 horas
        hora_fin_comida:
          type: string
          format: time
          description: >-
            Solo se exige que sea distinta de hora_inicio_comida. Si es menor o igual,
            la ventana se interpreta como que cruza a la medianoche, que es lo que
            necesita la jornada de noche.

    ComedorTurnoCicloBloque:
      type: object
      required: [dia_inicio, dia_fin, dias, etiqueta, estatus, configurada]
      properties:
        dia_inicio:
          type: integer
          description: Primer dia del tramo dentro del ciclo, base 1
        dia_fin:
          type: integer
        dias:
          type: integer
        etiqueta:
          type: string
          description: Dias 1-2 en un rotativo, Lun-Vie en un fijo
        estatus:
          type: string
          enum: [LABORABLE, DESCANSO]
        ho_codigo:
          type: [string, "null"]
        ho_descripcion:
          type: [string, "null"]
        hora_entrada:
          type: [string, "null"]
          format: time
        hora_salida:
          type: [string, "null"]
          format: time
        hora_inicio_comida:
          type: [string, "null"]
          format: time
          description: Siempre null en un tramo de descanso
        hora_fin_comida:
          type: [string, "null"]
          format: time
        configurada:
          type: boolean

    ComedorTurnoComidaItem:
      type: object
      required: [tu_codigo, descripcion, activo, tipo_turno]
      properties:
        tu_codigo:
          type: string
          description: Codigo del turno sin relleno de espacios
        descripcion:
          type: string
        activo:
          type: boolean
          description: tu_activo del catalogo normalizado a booleano
        tipo_turno:
          type: string
          enum: [FIJO, ROTATIVO]
          description: >-
            Se deriva del dato, no del nombre. rotativo = tu_rit_pat no vacio.
        jornada_horas:
          type: [number, "null"]
        dias_semana:
          type: [integer, "null"]
        empleados_activos:
          type: [integer, "null"]
        longitud_ciclo:
          type: [integer, "null"]
          description: 7 en un fijo. 21, 28 o 56 en los rotativos reales de la planta
        jornadas:
          type: array
          items:
            type: string
        jornadas_configuradas:
          type: integer
        bloques:
          type: array
          items:
            $ref: "#/components/schemas/ComedorTurnoCicloBloque"
        aviso:
          type: [string, "null"]
          description: Texto para degradar la fila cuando el ciclo no se puede calcular

    ComedorVentanaComidaResponse:
      type: object
      required: [no_empleado, fecha]
      properties:
        no_empleado:
          type: string
        nombre:
          type: [string, "null"]
        fecha:
          type: string
          format: date
        tu_codigo:
          type: [string, "null"]
        turno_descripcion:
          type: [string, "null"]
        tipo_turno:
          type: [string, "null"]
          enum: [FIJO, ROTATIVO, null]
        estatus:
          type: [string, "null"]
          enum: [LABORABLE, DESCANSO, null]
        posicion_ciclo:
          type: [integer, "null"]
          description: Posicion de la fecha dentro del ciclo, base 1
        longitud_ciclo:
          type: [integer, "null"]
        ho_codigo:
          type: [string, "null"]
        ho_descripcion:
          type: [string, "null"]
        hora_entrada:
          type: [string, "null"]
          format: time
        hora_salida:
          type: [string, "null"]
          format: time
        hora_inicio_comida:
          type: [string, "null"]
          format: time
        hora_fin_comida:
          type: [string, "null"]
          format: time
        motivo_sin_ventana:
          type: [string, "null"]
          enum:
            - DESCANSO
            - JORNADA_SIN_CONFIGURAR
            - JORNADA_FUERA_DE_CATALOGO
            - SIN_TURNO
            - TURNO_FUERA_DE_CATALOGO
            - PATRON_INVALIDO
            - ANCLA_INVALIDA
            - null
          description: Por que no hay ventana de comida, en vez de devolver horas vacias
        aviso:
          type: [string, "null"]
        turno_sincronizado_en:
          type: [string, "null"]
          format: date-time
          description: >-
            Fecha del ultimo sync empleado-turno. El turno es una foto de hoy, no un
            historico. consultar una fecha pasada de alguien que cambio de rotacion
            devuelve su turno actual.

