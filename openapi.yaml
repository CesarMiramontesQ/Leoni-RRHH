        - name: area_id
          in: query
          description: Recorta el resumen a un área — los pares por empleado y las sesiones por tener inscritos de esa área.
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Resumen del dashboard de seguimiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursosDashboardResumenResponse"

