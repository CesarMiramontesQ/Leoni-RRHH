            Tipos especiales (`matrimonio`, `incapacidad_interna`, `defuncion`, `paternidad`)
            solo pueden ser creados por RH. Reglas automáticas:
            matrimonio=2 días, defuncion=3 días (administrativos: 3 días hábiles con ajuste si cruza fin de semana), paternidad=7 días hábiles (ajuste si inicio en fin de semana),
            incapacidad_interna con duración manual.
            El tipo `permiso_sin_goce_sueldo` solo puede crearlo supervisor, gerente,
            RH o director, y requiere `motivo`.
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
          description: Debe ser >= fecha_inicio
        motivo:
          type: [string, "null"]
          description: Obligatorio cuando `tipo=permiso_sin_goce_sueldo`.
        comentarios:
          type: [string, "null"]
        empleado_id:
          type: integer
          nullable: true
          description: >
            ID del colaborador titular. Si se omite o coincide con el usuario autenticado,
            la solicitud es propia. Supervisor/gerente/RH/director pueden indicar un colaborador
            dentro de su alcance.

