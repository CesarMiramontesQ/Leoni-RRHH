          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: X-RH-UI-Mode
          in: header
          required: false
          description: >
            Modo UI activo para usuarios RH. `operativo`: vista RH (módulos asignados o acceso
            completo si el puesto tiene capacidad gestor). `empleado`: autoservicio personal.
            `lider` / `gerente`: vista de equipo (solo si el JWT incluye `rh_gestor_alcance`
            supervisor o gerente). Afecta alcance de listados, aprobaciones y permisos efectivos.
          schema:
            type: string
            enum: [operativo, empleado, lider, gerente]
