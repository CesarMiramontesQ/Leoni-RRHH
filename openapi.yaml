      required: [id, nombre, categoria, activo, created_at, updated_at]
      properties:
        id:
          type: integer
        nombre:
          type: string
        descripcion:
          type: [string, "null"]
        categoria:
          type: string
          enum: [tecnica, blanda]
        subcategoria:
          type: [string, "null"]
        area_id:
          type: [integer, "null"]
        area_nombre:
          type: [string, "null"]
        activo:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CompetenciaListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompetenciaResponse"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    MatrizCelda:
      type: object
      required: [competencia_id, puesto_perfil_id, nivel_requerido]
      properties:
        competencia_id:
          type: integer
        puesto_perfil_id:
          type: integer
        nivel_requerido:
          type: integer
          minimum: 0
          maximum: 4

    MatrizRow:
      type: object
      required: [competencia_id, competencia_nombre, categoria, niveles]
