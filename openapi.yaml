        nivel_actual:
          type: integer
          minimum: 0
          maximum: 4
        observaciones:
          type: string
          nullable: true

    EvaluacionUpdate:
      type: object
      properties:
        nivel_actual:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
        observaciones:
          type: string
          nullable: true

    EvaluacionResponse:
      type: object
      required: [id, empleado_id, competencia_id, nivel_actual, fecha_evaluacion, created_at, updated_at]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        empleado_nombre:
          type: string
          nullable: true
        competencia_id:
          type: integer
        competencia_nombre:
          type: string
          nullable: true
        nivel_actual:
          type: integer
          minimum: 0
          maximum: 4
        evaluador_id:
          type: integer
          nullable: true
        evaluador_nombre:
          type: string
          nullable: true
        observaciones:
          type: string
          nullable: true
        fecha_evaluacion:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EvaluacionListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvaluacionResponse"
        total:
          type: integer
        page:
