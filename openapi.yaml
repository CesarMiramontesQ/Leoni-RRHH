      type: string
      enum:
        - falta_justificada
        - falta_injustificada
        - retardo
        - incapacidad
        - suspension
        - matrimonio
        - incapacidad_interna
        - defuncion
        - paternidad
        - vacaciones

    FaltaRetardoCreateRequest:
      type: object
      required: [empleado_id, tipo, fecha_evento]
      description: >
        Para tipo=suspension, fecha_fin es obligatoria y observaciones es el motivo TRESS
        (obligatoria, max 30 caracteres). La suspensión se inserta primero en DATOS_ANALISIS
        (dbo.PERMISO) y luego en Bono. Los tipos con goce fijos (matrimonio, defuncion,
        paternidad) se parten por semana calendario (lun–dom): un INSERT dbo.PERMISO
        (PM_TIPO='FJ ', PM_NUMERO='PERMISO', PM_CLASIFI=0) y una fila en
        levelup_faltas_retardos por tramo. incapacidad_interna solo se guarda en levelup
        (sin cola RPA). No se usa tress_robot_queue.
        `falta_injustificada`, `retardo` y `vacaciones` NO se aceptan (422): los pone
        nómina y llegan por el sync desde dbo.AUSENCIA, no por captura.
      properties:
        empleado_id:
          type: integer
          minimum: 1
        tipo:
          allOf:
            - $ref: "#/components/schemas/FaltaRetardoTipo"
          description: >
            Excluye falta_injustificada y retardo, que solo entran por el sync desde TRESS.
          enum:
            - falta_justificada
            - incapacidad
            - suspension
            - matrimonio
            - incapacidad_interna
            - defuncion
            - paternidad
        fecha_evento:
          type: string
          format: date
        fecha_fin:
          type: [string, "null"]
          format: date
          description: Obligatoria para incapacidad, suspensión y permisos con goce.
        observaciones:
          type: [string, "null"]
          maxLength: 4000
          description: >
            Para suspensión, motivo TRESS (PM_COMENTA); obligatoria y maxLength efectivo 30.

    FaltaRetardoResponse:
      type: object
      required:
        - id
        - empleado_id
        - tipo
        - fecha_evento
        - created_at
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        empleado_nombre:
          type: [string, "null"]
        numero_empleado:
          type: [string, "null"]
        tipo:
          $ref: "#/components/schemas/FaltaRetardoTipo"
        fecha_evento:
          type: string
          format: date
        fecha_fin:
          type: [string, "null"]
          format: date
        observaciones:
          type: [string, "null"]
        registrado_por_id:
          type: [integer, "null"]
        registrado_por_nombre:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        origen:
          type: [string, "null"]
          description: >-
            `ausencia` (fila diaria de TRESS), `permiso` (permiso con goce de
            TRESS) o `manual` (registrado desde el sistema). Los valores
            `importadas_historico`, `ponderaciones` y `evaluacion_historica` son
            del origen anterior en bono y ya no aparecen en el listado.
          examples: [ausencia, permiso, manual]
        origen_id:
          type: [integer, "null"]

