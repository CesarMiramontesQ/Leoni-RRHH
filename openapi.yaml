        modalidad:
          type: string
        instructor:
          type: [string, "null"]
        fecha_inicio:
          type: [string, "null"]
          format: date-time
        fecha_fin:
          type: [string, "null"]
          format: date-time
        cupo_maximo:
          type: [integer, "null"]
        area_id:
          type: [integer, "null"]
        area_nombre:
          type: [string, "null"]
        competencias_asociadas:
          type: [array, "null"]
          items:
            type: object
        estado:
          type: string
        inscritos_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CapacitacionListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
