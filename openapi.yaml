    get:
      tags: [Level Up - Cursos Dashboard]
      summary: Registros paginados de seguimiento empleado-curso
      operationId: cursos_dashboard_registros
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
        - name: empleado_id
          in: query
          schema:
            type: integer
        - name: curso_id
          in: query
          schema:
            type: integer
        - name: area_id
          in: query
          schema:
            type: integer
        - name: puesto_id
          in: query
          schema:
            type: integer
        - name: estado_curso
          in: query
          schema:
            type: string
            enum: [pendiente, programado, completado, no_acreditado, en_progreso]
