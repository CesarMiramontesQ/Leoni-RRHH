        nombre:
          type: string
        area_nombre:
          type: [string, "null"]
        nivel:
          type: [string, "null"]
        personas:
          type: integer
        cumplimiento_pct:
          type: integer
        brechas:
          type: integer
        cursos:
          type: integer
        evidencias:
          type: integer

    ResumenTarjetasResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PerfilTarjetaItem"

    PuestoPerfilResponse:
      type: object
      required: [id, codigo, nombre, version, activo, created_at, updated_at]
      properties:
        id:
          type: integer
        codigo:
          type: string
        nombre:
          type: string
        area_id:
          type: [integer, "null"]
        area_nombre:
          type: [string, "null"]
        nivel:
          type: [string, "null"]
        descripcion:
          type: [string, "null"]
        competencias_tecnicas:
          type: [object, "null"]
        habilidades_blandas:
          type: [object, "null"]
        maquinas_herramientas:
          type: [object, "null"]
        version:
          type: integer
        activo:
          type: boolean
        created_by:
          type: [integer, "null"]
        updated_by:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PuestoPerfilListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PuestoPerfilResponse"
