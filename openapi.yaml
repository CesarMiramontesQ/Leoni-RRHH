  # ── Faltas y retardos ──────────────────────────────
  /api/v1/faltas-retardos:
    get:
      tags: [Faltas y retardos]
      summary: Listar eventos de asistencia
      description: >-
        Se lee de DATOS_ANALISIS (TRESS): `dbo.AUSENCIA` día por día para faltas,
        retardos, suspensiones e incapacidades, y `dbo.PERMISO` con goce como un
        solo renglón con rango (los días FJ cubiertos por ese permiso se excluyen
        para no duplicarlos). Los permisos con goce e incapacidades internas
        registrados desde el sistema se completan con la copia local, que aporta
        el motivo y quién los capturó.
      operationId: faltas_retardos_list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: empleado_id
          in: query
          schema:
            type: integer
        - name: tipo
          in: query
          schema:
            $ref: "#/components/schemas/FaltaRetardoTipo"
        - name: fecha_inicio
          in: query
          description: >-
            Sin `fecha_inicio` ni `fecha_fin` se aplica una ventana de los últimos
            12 meses; indicar una fecha anterior consulta todo el histórico.
          schema:
            type: string
            format: date
        - name: fecha_fin
          in: query
          schema:
            type: string
            format: date
        - name: busqueda
          in: query
          description: Nombre o número de empleado
          schema:
            type: string
      responses:
        "200":
          description: Página de eventos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaltasRetardosPageResponse"
        "503":
          description: DATOS_ANALISIS no está configurada o no responde
    post:
      tags: [Faltas y retardos]
      summary: Registrar evento de asistencia
      operationId: faltas_retardos_create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaltaRetardoCreateRequest"
      responses:
        "201":
          description: >
            Evento creado. Para matrimonio/defunción/paternidad que cruzan semana
            calendario se crean N filas; la respuesta es el primer tramo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaltaRetardoResponse"
        "409":
          description: Conflicto TRESS (traslape permiso/vacación/incapacidad, dry-run, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "422":
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          description: TRESS / datos-analisis no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /api/v1/faltas-retardos/tipos:
    get:
      tags: [Faltas y retardos]
      summary: Catálogo de tipos de evento
      operationId: faltas_retardos_tipos
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tipos disponibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaltasRetardosTiposResponse"

  /api/v1/faltas-retardos/estadisticas:
    get:
      tags: [Faltas y retardos]
      summary: Estadísticas de eventos de asistencia
      description: >-
        Se agrega sobre la misma fuente que el listado (DATOS_ANALISIS + los
        eventos locales), de modo que los KPIs cuadran con el total de la tabla.
        Aplica la misma ventana de 12 meses cuando no se indican fechas. El
        filtro `area` se resuelve contra el organigrama local y viaja como lista
        de números de empleado.
      operationId: faltas_retardos_estadisticas
      security:
        - BearerAuth: []
      parameters:
        - name: empleado_id
          in: query
          schema:
            type: integer
        - name: tipo
          in: query
          schema:
            $ref: "#/components/schemas/FaltaRetardoTipo"
        - name: fecha_inicio
          in: query
          schema:
            type: string
            format: date
        - name: fecha_fin
          in: query
          schema:
            type: string
            format: date
        - name: busqueda
          in: query
          description: Nombre o número de empleado
          schema:
            type: string
        - name: area
          in: query
          description: Nombre de área
          schema:
            type: string
        - name: tendencia_agrupacion
          in: query
          description: "Granularidad de tendencia por tipo: dia, semana o mes"
          schema:
            type: string
            enum: [dia, semana, mes]
      responses:
        "200":
          description: Totales por tipo con filtros aplicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaltasRetardosEstadisticasResponse"

