openapi: 3.1.0
info:
  title: Plataforma RH Leoni Cable
  description: >
    Plataforma on-premise de Recursos Humanos para Leoni Cable (Mexico).
    Gestiona solicitudes de empleados (vacaciones, permisos), incidencias,
    actas administrativas, comedor/acceso biometrico, organigrama e
    integracion con nomina TRESS.
  version: 1.0.0
  contact:
    name: Leoni Cable - Equipo de Desarrollo

servers:
  - url: http://localhost:8000
    description: Desarrollo local (Docker)

tags:
  - name: Root
    description: Health check y estado del sistema
  - name: Autenticacion
    description: Login, logout, refresh de tokens JWT
  - name: Usuarios
    description: Gestion de cuentas de usuario (CRUD)
  - name: Empleados
    description: Directorio de empleados, Vista 360 y metricas
  - name: Solicitudes
    description: Vacaciones, permisos, home office y flujo de aprobacion
  - name: Incidencias
    description: Registro y seguimiento de incidencias laborales
  - name: Actas Administrativas
    description: Generacion, edicion, firma y PDF de actas
  - name: Comedor
    description: Menu semanal, reservas, acceso biometrico y terminal
  - name: Reportes
    description: Dashboard KPIs y exportacion PDF/Excel
  - name: Notificaciones
    description: Bandeja de notificaciones del usuario
  - name: Organigrama
    description: Estructura jerarquica organizacional
  - name: Talento - Competencias
    description: Gestion de competencias y matriz de competencias por area
  - name: Talento - Puestos Perfil
    description: Perfiles de puesto con competencias, habilidades y generacion IA
  - name: Talento - Tareas Catalogo
    description: Catalogo centralizado de tareas reutilizables en perfiles de puesto
  - name: Bono productividad
    description: Lectura de datos en la base externa bono_productividad (PostgreSQL)
  - name: Talento - Evaluaciones
    description: Evaluaciones de competencias por empleado (CRUD, bulk, permisos por rol)
  - name: Talento - Capacitaciones
    description: Gestion de capacitaciones (CRUD, inscripciones, catalogo)
  - name: Talento - PDI
    description: Plan de Desarrollo Individual — KPIs avanzados, recomendaciones AI, export, notificaciones
  - name: Level Up - Catálogos Cursos
    description: Catálogos de cursos (categorías, tipos, instructores, proveedores)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clave de API para terminales de comedor

  schemas:
    # ── Ciclo de Desempeño / Calibración ──────────────
    BandaAjusteItem:
      type: object
      required: [empleado_id]
      properties:
        empleado_id:
          type: integer
        banda_ajustada:
          type: [string, "null"]
          enum: [bajo, medio, alto, null]
          description: Override de banda; null revierte el ajuste
        motivo:
          type: [string, "null"]
          description: Obligatorio (no vacío) cuando banda_ajustada no es null

    CalibracionRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BandaAjusteItem" }

    DistribucionBanda:
      type: object
      properties:
        bajo: { type: integer, default: 0 }
        medio: { type: integer, default: 0 }
        alto: { type: integer, default: 0 }
        total: { type: integer, default: 0 }
        pct:
          type: object
          additionalProperties: { type: number }

    DistribucionResponse:
      type: object
      required: [ciclo_id, actual, objetivo, desviacion]
      properties:
        ciclo_id:
          type: integer
        actual: { $ref: "#/components/schemas/DistribucionBanda" }
        objetivo:
          type: object
          additionalProperties: { type: number }
        desviacion:
          type: object
          additionalProperties: { type: number }

    CicloDesempenoResultadoResponse:
      type: object
      required: [id, ciclo_id, empleado_id]
      properties:
        id: { type: integer }
        ciclo_id: { type: integer }
        empleado_id: { type: integer }
        empleado_nombre: { type: [string, "null"] }
        area_id: { type: [integer, "null"] }
        area_nombre: { type: [string, "null"] }
        cumplimiento_metas: { type: [number, "null"] }
        calificacion_360_raw: { type: [number, "null"] }
        calificacion_360_norm: { type: [number, "null"] }
        escala_min: { type: [number, "null"] }
        escala_max: { type: [number, "null"] }
        calificacion_desempeno: { type: [number, "null"] }
        peso_metas_efectivo: { type: [number, "null"] }
        peso_competencias_efectivo: { type: [number, "null"] }
        indice_historial: { type: [number, "null"] }
        peso_historial_efectivo: { type: [number, "null"] }
        potencial: { type: [number, "null"] }
        banda_desempeno: { type: [string, "null"], enum: [bajo, medio, alto, null] }
        banda_potencial: { type: [string, "null"], enum: [bajo, medio, alto, null] }
        segmento_9box: { type: [string, "null"] }
        banda_desempeno_ajustada: { type: [string, "null"], enum: [bajo, medio, alto, null] }
        banda_desempeno_efectiva: { type: [string, "null"], enum: [bajo, medio, alto, null] }
        banda_ajuste_motivo: { type: [string, "null"] }
        banda_ajustada_por_id: { type: [integer, "null"] }
        banda_ajustada_at: { type: [string, "null"], format: date-time }
        potencial_capturado_por_id: { type: [integer, "null"] }
        potencial_capturado_at: { type: [string, "null"], format: date-time }
        snapshot_at: { type: [string, "null"], format: date-time }

    # ── Auth ──────────────────────────────────────────
    TokenResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # ── Catalogos base ────────────────────────────────
    AreaResponse:
      type: object
      required: [area_id, descripcion, estatus_id]
      properties:
        area_id:
          type: integer
        descripcion:
          type: string
        estatus_id:
          type: integer

    SubareaResponse:
      type: object
      required: [subarea_id, area_id, descripcion, estatus_id]
      properties:
        subarea_id:
          type: integer
        area_id:
          type: integer
        descripcion:
          type: string
        estatus_id:
          type: integer

    PuestoResponse:
      type: object
      required: [puesto_id, descripcion, estatus_id]
      properties:
        puesto_id:
          type: integer
        area_id:
          type: [integer, "null"]
        descripcion:
          type: string
        estatus_id:
          type: integer

    CategoriaResponse:
      type: object
      required: [categoria_id, estatus_id]
      properties:
        categoria_id:
          type: integer
        descripcion:
          type: [string, "null"]
        nivel:
          type: [string, "null"]
        estatus_id:
          type: integer

    EstadoEmpleadoResponse:
      type: object
      required: [estado_id, descripcion, estatus_id]
      properties:
        estado_id:
          type: integer
        descripcion:
          type: string
        estatus_id:
          type: integer

    ClasificacionEmpleadoResponse:
      type: object
      required: [clasificacion_id, descripcion, estatus_id]
      properties:
        clasificacion_id:
          type: integer
        descripcion:
          type: string
        significado:
          type: [string, "null"]
        estatus_id:
          type: integer

    RolBrief:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
        nombre:
          type: string

    RhModuloCatalogItem:
      type: object
      required: [key, label, group, nav_item_ids]
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
        nav_item_ids:
          type: array
          items:
            type: string

    RhPermisosMeResponse:
      type: object
      required: [rol, puede_administrar_permisos_rh, modulos, inscrito, en_lista_permisos]
      properties:
        rol:
          type: string
        puede_administrar_permisos_rh:
          type: boolean
        modulos:
          type: object
          additionalProperties:
            type: boolean
        inscrito:
          type: boolean
        en_lista_permisos:
          type: boolean
          description: >-
            El usuario aparece en la lista de administración de permisos. Un RH
            removido sigue inscrito pero queda fuera de la lista; el toggle
            Modo RH/empleado solo se muestra cuando es true.

    RhUsuarioPermisosItem:
      type: object
      required:
        - empleado_id
        - no_empleado
        - nombre
        - rol_nombre
        - activo
        - permisos_personalizados
        - puede_administrar_permisos_rh
        - modulos
        - editable
      properties:
        empleado_id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        email:
          type: [string, "null"]
        rol_nombre:
          type: string
        activo:
          type: boolean
        permisos_personalizados:
          type: boolean
        puede_administrar_permisos_rh:
          type: boolean
        modulos:
          type: object
          additionalProperties:
            type: boolean
        editable:
          type: boolean

    RhEmpleadoBusquedaItem:
      type: object
      required: [empleado_id, no_empleado, nombre, rol_nombre]
      properties:
        empleado_id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        email:
          type: [string, "null"]
        rol_nombre:
          type: string

    RhPermisosUpdate:
      type: object
      required: [modulos]
      properties:
        modulos:
          type: object
          additionalProperties:
            type: boolean

    RhAdminPermisosUpdate:
      type: object
      required: [conceder]
      properties:
        conceder:
          type: boolean
          description: true = otorgar admin, false = revocar admin

    # ── Dashboard (KPIs de nómina) ────────────────────
    DashboardKpisResponse:
      type: object
      required: [disponible, anio]
      properties:
        disponible:
          type: boolean
          description: false si el empleado aún no tiene saldo sincronizado en levelup_vacaciones_disponibles
        vacaciones_disponibles:
          type: number
          nullable: true
          description: Suma de días de gozo pendientes de todos los aniversarios
        vacaciones_tomadas_ciclo:
          type: number
          nullable: true
          description: Días ya gozados del aniversario vigente
        vacaciones_derecho_ciclo:
          type: number
          nullable: true
          description: Días que corresponden en el aniversario vigente
        ciclo_aniversario:
          type: integer
          nullable: true
          description: Número de aniversario vigente en TRESS
        ciclo_vence:
          type: string
          format: date
          nullable: true
        home_office_dias_anio:
          type: integer
          nullable: true
          description: Días de home office registrados en el año en curso
        anio:
          type: integer
          description: Año al que corresponde el KPI de home office

    # ── Vistas por rol ────────────────────────────────
    VistaRolCatalogItem:
      type: object
      required: [key, label, descripcion, grupo, ruta, activa, nav_item_ids, roles]
      properties:
        key:
          type: string
          description: Identificador único de la vista en el catálogo
        label:
          type: string
          description: Nombre visible
        descripcion:
          type: string
        grupo:
          type: string
          description: Agrupación en la pantalla de configuración
        ruta:
          type: string
          description: Ruta (hash) principal de la vista en el frontend
        activa:
          type: boolean
          description: Vista activa en el catálogo
        nav_item_ids:
          type: array
          items:
            type: string
        roles:
          type: array
          description: Roles configurables (empleado, supervisor, gerente)
          items:
            type: string

    VistaRolMeResponse:
      type: object
      required: [rol, configurable, vistas]
      properties:
        rol:
          type: string
          description: >-
            Rol cuya configuración aplica. Para un admin RH que simula otro perfil con
            el toggle, es el rol simulado (no el suyo).
        configurable:
          type: boolean
          description: >-
            false cuando el gate no aplica - admin RH en Modo RH, o rol fuera del
            alcance (director, rh).
        vistas:
          type: object
          additionalProperties:
            type: boolean
        por_rol:
          type: object
          nullable: true
          description: >-
            Matriz rol -> vistas. Solo se envía a admins RH, para que alternar el modo
            de UI aplique la configuración del rol simulado sin otra petición.
          additionalProperties:
            type: object
            additionalProperties:
              type: boolean

    VistaRolConfigResponse:
      type: object
      required: [roles, config]
      properties:
        roles:
          type: array
          items:
            type: string
        config:
          type: object
          description: Mapa rol -> (vista_key -> habilitado)
          additionalProperties:
            type: object
            additionalProperties:
              type: boolean

    VistaRolCambio:
      type: object
      required: [rol, vista_key, habilitado]
      properties:
        rol:
          type: string
          enum: [empleado, supervisor, gerente]
        vista_key:
          type: string
        habilitado:
          type: boolean

    VistaRolConfigUpdate:
      type: object
      properties:
        cambios:
          type: array
          items:
            $ref: "#/components/schemas/VistaRolCambio"

    # ── Empleados / Usuarios ──────────────────────────
    EmpleadoResponse:
      type: object
      required: [id, empleado_id, no_empleado, nombre]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: integer
        no_sap:
          type: [integer, "null"]
        nombre:
          type: string
        email:
          type: [string, "null"]
        usuario:
          type: [string, "null"]
        rol_id:
          type: [integer, "null"]
          description: Rol del proyecto (levelup_empleados_core); null si el empleado de Bono no tiene cuenta.
        categoria:
          $ref: "#/components/schemas/CategoriaResponse"
        subarea:
          $ref: "#/components/schemas/SubareaResponse"
        puesto:
          $ref: "#/components/schemas/PuestoResponse"
        estado:
          $ref: "#/components/schemas/EstadoEmpleadoResponse"
        area:
          $ref: "#/components/schemas/AreaResponse"
        clasificacion:
          $ref: "#/components/schemas/ClasificacionEmpleadoResponse"
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        centrocosto_id:
          type: [integer, "null"]
        recibe_bono:
          type: [boolean, "null"]
        brigada:
          type: [string, "null"]
        registro:
          type: [string, "null"]
          description: Texto de alta tal como vive en Bono (columna String, no necesariamente fecha ISO).
        a_restringido:
          type: [string, "null"]
          description: Valor 'S'/'N' tal como vive en Bono.
        requiere_cambio_password:
          type: [boolean, "null"]
        created_at:
          type: [string, "null"]
          format: date-time

    UsuarioResponse:
      type: object
      required: [id, empleado_id, no_empleado, nombre]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: integer
        nombre:
          type: string
        email:
          type: [string, "null"]
        rol_id:
          type: [integer, "null"]
          description: Rol del proyecto (levelup_empleados_core); null si el empleado de Bono no tiene cuenta.
        rol:
          $ref: "#/components/schemas/RolBrief"
        estado:
          $ref: "#/components/schemas/EstadoEmpleadoResponse"
        area:
          $ref: "#/components/schemas/AreaResponse"
        subarea:
          $ref: "#/components/schemas/SubareaResponse"
        puesto:
          $ref: "#/components/schemas/PuestoResponse"
        categoria:
          $ref: "#/components/schemas/CategoriaResponse"
        clasificacion:
          $ref: "#/components/schemas/ClasificacionEmpleadoResponse"
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        centrocosto_id:
          type: [integer, "null"]
        foto:
          type: [string, "null"]
        registro:
          type: [string, "null"]
          description: Texto de alta tal como vive en Bono (columna String, no necesariamente fecha ISO).
        created_at:
          type: [string, "null"]
          format: date-time

    UsuarioListItem:
      allOf:
        - $ref: "#/components/schemas/UsuarioResponse"
        - type: object
          properties:
            lider_nombre:
              type: [string, "null"]

    UsuarioAsignacionUpdate:
      type: object
      properties:
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        rol_id:
          type: [integer, "null"]
        comedor_id:
          type: integer
          minimum: 1
          description: ID del comedor en catálogo; persiste en turnos_empleados

    UsuarioPageResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsuarioListItem"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    HorasExtraLiderResponse:
      type: object
      required: [empleado_id, nombre]
      properties:
        empleado_id:
          type: integer
        nombre:
          type: string

    HorasExtraEmpleadoResponse:
      type: object
      required: [id, empleado_id, no_empleado, nombre]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        puesto_nombre:
          type: string
          nullable: true
        centrocosto_id:
          type: integer
          nullable: true
        lider:
          $ref: "#/components/schemas/HorasExtraLiderResponse"
          nullable: true

    HorasExtraSolicitudInfoResponse:
      type: object
      required:
        - solicitud_id
        - semana
        - semana_inicio
        - fecha_solicitud
        - tipo
        - centrocosto_id
        - estado
        - estado_consolidado
        - total_horas
      properties:
        solicitud_id:
          type: integer
        semana:
          type: integer
        semana_inicio:
          type: string
          format: date
        fecha_solicitud:
          type: string
          format: date
        tipo:
          type: string
          enum: [planeado, espontaneo]
        area_descripcion:
          type: string
          nullable: true
        centrocosto_id:
          type: integer
        centrocosto_descripcion:
          type: string
          nullable: true
        motivo:
          type: string
          nullable: true
        estado:
          type: string
          enum: [borrador, pendiente, aprobado, rechazado, cancelado]
        estado_consolidado:
          type: string
          enum: [pendiente, aprobado_parcial, aprobado, rechazado]
        total_horas:
          type: number
        registrado_por_nombre:
          type: string
          nullable: true
        aprobador_nombre:
          type: string
          nullable: true
        fecha_aprobacion:
          type: string
          format: date
          nullable: true

    HorasExtraFilaResponse:
      type: object
      required: [empleado, solicitud]
      properties:
        empleado:
          $ref: "#/components/schemas/HorasExtraEmpleadoResponse"
        solicitud:
          $ref: "#/components/schemas/HorasExtraSolicitudInfoResponse"

    HorasExtraResumenResponse:
      type: object
      required:
        - total_horas_extra
        - colaboradores_con_registro
        - empleados_con_horas_extra
        - empleados_activos_planta
        - solicitudes_total
        - solicitudes_pendientes
        - solicitudes_aprobadas
        - solicitudes_rechazadas
        - porcentaje_aprobacion
      properties:
        total_horas_extra:
          type: number
        colaboradores_con_registro:
          type: integer
        empleados_con_horas_extra:
          type: integer
        empleados_activos_planta:
          type: integer
        solicitudes_total:
          type: integer
        solicitudes_pendientes:
          type: integer
        solicitudes_aprobadas:
          type: integer
        solicitudes_rechazadas:
          type: integer
        porcentaje_aprobacion:
          type: number

    HorasExtraCentroCostoOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: integer
        label:
          type: string

    HorasExtraFilterOptionsResponse:
      type: object
      required: [centros_costo]
      properties:
        centros_costo:
          type: array
          items:
            $ref: "#/components/schemas/HorasExtraCentroCostoOption"

    HorasExtraCatalogoOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: integer
        label:
          type: string

    HorasExtraSubareaOption:
      type: object
      required: [id, label, area_id]
      properties:
        id:
          type: integer
        label:
          type: string
        area_id:
          type: integer

    HorasExtraEmpleadoOption:
      type: object
      required: [id, no_empleado, nombre]
      properties:
        id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        centrocosto_id:
          type: [integer, "null"]
        area_id:
          type: [integer, "null"]
        subarea_id:
          type: [integer, "null"]
        area_descripcion:
          type: [string, "null"]
        centrocosto_descripcion:
          type: [string, "null"]
        turno:
          type: [string, "null"]

    HorasExtraSolicitudOpcionesResponse:
      type: object
      required: [empleados, semana_actual]
      properties:
        empleados:
          type: array
          items:
            $ref: "#/components/schemas/HorasExtraEmpleadoOption"
        semana_actual:
          type: integer
          minimum: 1
          maximum: 53

    HorasExtraDetalleCreate:
      type: object
      required: [empleado_id, lunes, martes, miercoles, jueves, viernes, sabado, domingo]
      properties:
        empleado_id:
          type: integer
        lunes:
          type: number
          minimum: 0
        martes:
          type: number
          minimum: 0
        miercoles:
          type: number
          minimum: 0
        jueves:
          type: number
          minimum: 0
        viernes:
          type: number
          minimum: 0
        sabado:
          type: number
          minimum: 0
        domingo:
          type: number
          minimum: 0

    HorasExtraSolicitudCreate:
      type: object
      required:
        - semana
        - tipo
        - motivo
        - empleados
      properties:
        semana:
          type: integer
          minimum: 1
          maximum: 53
        tipo:
          type: string
          enum: [planeado, espontaneo]
        motivo:
          type: string
          minLength: 1
          maxLength: 500
        empleados:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/HorasExtraDetalleCreate"

    HorasExtraDetalleResponse:
      type: object
      required:
        - id
        - empleado_id
        - no_empleado
        - nombre_empleado
        - lunes
        - martes
