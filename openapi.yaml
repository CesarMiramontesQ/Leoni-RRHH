openapi: 3.1.0
info:
  title: Plataforma RH Leoni Cable
  description: >
    Plataforma on-premise de Recursos Humanos para Leoni Cable (Mexico).
    Gestiona solicitudes de empleados (vacaciones, permisos), incidencias,
    actas administrativas, comedor/acceso biometrico, organigrama e
    integracion con nomina TRESS.
  version: 1.0.0
  contact:
    name: Leoni Cable - Equipo de Desarrollo

servers:
  - url: http://localhost:8000
    description: Desarrollo local (Docker)

tags:
  - name: Root
    description: Health check y estado del sistema
  - name: Autenticacion
    description: Login, logout, refresh de tokens JWT
  - name: Usuarios
    description: Gestion de cuentas de usuario (CRUD)
  - name: Empleados
    description: Directorio de empleados, Vista 360 y metricas
  - name: Solicitudes
    description: Vacaciones, permisos, home office y flujo de aprobacion
  - name: Incidencias
    description: Registro y seguimiento de incidencias laborales
  - name: Actas Administrativas
    description: Generacion, edicion, firma y PDF de actas
  - name: Comedor
    description: Menu semanal, reservas, acceso biometrico y terminal
  - name: Reportes
    description: Dashboard KPIs y exportacion PDF/Excel
  - name: Notificaciones
    description: Bandeja de notificaciones del usuario
  - name: Organigrama
    description: Estructura jerarquica organizacional
  - name: Talento - Competencias
    description: Gestion de competencias y matriz de competencias por area
  - name: Talento - Puestos Perfil
    description: Perfiles de puesto con competencias, habilidades y generacion IA
  - name: Bono productividad
    description: Lectura de datos en la base externa bono_productividad (PostgreSQL)
  - name: Talento - Evaluaciones
    description: Evaluaciones de competencias por empleado (CRUD, bulk, permisos por rol)
  - name: Talento - Capacitaciones
    description: Gestion de capacitaciones (CRUD, inscripciones, catalogo)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clave de API para terminales de comedor

  schemas:
    # ── Auth ──────────────────────────────────────────
    TokenResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # ── Catalogos base ────────────────────────────────
    AreaResponse:
      type: object
      required: [area_id, descripcion, estatus_id]
      properties:
        area_id:
          type: integer
        descripcion:
          type: string
        estatus_id:
          type: integer

    SubareaResponse:
      type: object
      required: [subarea_id, area_id, descripcion, estatus_id]
      properties:
        subarea_id:
          type: integer
        area_id:
          type: integer
        descripcion:
          type: string
        estatus_id:
          type: integer

    PuestoResponse:
      type: object
      required: [puesto_id, descripcion, estatus_id]
      properties:
        puesto_id:
          type: integer
        area_id:
          type: [integer, "null"]
        descripcion:
          type: string
        estatus_id:
          type: integer

    CategoriaResponse:
      type: object
      required: [categoria_id, estatus_id]
      properties:
        categoria_id:
          type: integer
        descripcion:
          type: [string, "null"]
        nivel:
          type: [string, "null"]
        estatus_id:
          type: integer

    EstadoEmpleadoResponse:
      type: object
      required: [estado_id, descripcion, estatus_id]
      properties:
        estado_id:
          type: integer
        descripcion:
          type: string
        estatus_id:
          type: integer

    ClasificacionEmpleadoResponse:
      type: object
      required: [clasificacion_id, descripcion, estatus_id]
      properties:
        clasificacion_id:
          type: integer
        descripcion:
          type: string
        significado:
          type: [string, "null"]
        estatus_id:
          type: integer

    RolBrief:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
        nombre:
          type: string

    # ── Empleados / Usuarios ──────────────────────────
    EmpleadoResponse:
      type: object
      required: [id, empleado_id, no_empleado, nombre, rol_id, created_at]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: string
        no_sap:
          type: [string, "null"]
        nombre:
          type: string
        email:
          type: [string, "null"]
        usuario:
          type: [string, "null"]
        rol_id:
          type: integer
        categoria:
          $ref: "#/components/schemas/CategoriaResponse"
        subarea:
          $ref: "#/components/schemas/SubareaResponse"
        puesto:
          $ref: "#/components/schemas/PuestoResponse"
        estado:
          $ref: "#/components/schemas/EstadoEmpleadoResponse"
        area:
          $ref: "#/components/schemas/AreaResponse"
        clasificacion:
          $ref: "#/components/schemas/ClasificacionEmpleadoResponse"
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        centrocosto_id:
          type: [integer, "null"]
        recibe_bono:
          type: [boolean, "null"]
        brigada:
          type: [string, "null"]
        registro:
          type: [string, "null"]
          format: date
        a_restringido:
          type: [boolean, "null"]
        requiere_cambio_password:
          type: [boolean, "null"]
        created_at:
          type: string
          format: date-time

    UsuarioResponse:
      type: object
      required: [id, empleado_id, no_empleado, nombre, rol_id, created_at]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        no_empleado:
          type: string
        nombre:
          type: string
        email:
          type: [string, "null"]
        rol_id:
          type: integer
        rol:
          $ref: "#/components/schemas/RolBrief"
        estado:
          $ref: "#/components/schemas/EstadoEmpleadoResponse"
        area:
          $ref: "#/components/schemas/AreaResponse"
        subarea:
          $ref: "#/components/schemas/SubareaResponse"
        puesto:
          $ref: "#/components/schemas/PuestoResponse"
        categoria:
          $ref: "#/components/schemas/CategoriaResponse"
        clasificacion:
          $ref: "#/components/schemas/ClasificacionEmpleadoResponse"
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        foto:
          type: [string, "null"]
        registro:
          type: [string, "null"]
          format: date
        created_at:
          type: string
          format: date-time

    UsuarioListItem:
      allOf:
        - $ref: "#/components/schemas/UsuarioResponse"
        - type: object
          properties:
            lider_nombre:
              type: [string, "null"]

    UsuarioAsignacionUpdate:
      type: object
      properties:
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        rol_id:
          type: [integer, "null"]

    UsuarioPageResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsuarioListItem"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    EmpleadoDistribucionItem:
      type: object
      required: [label, total]
      properties:
        label:
          type: string
        total:
          type: integer

    EmpleadosPorClasificacionAreaSerie:
      type: object
      required: [tipo, clasificacion_descripcion, por_area]
      properties:
        tipo:
          type: string
          enum: [administrativo, directo, indirecto]
        clasificacion_id:
          type: integer
          nullable: true
        clasificacion_descripcion:
          type: string
        por_area:
          type: array
          items:
            $ref: "#/components/schemas/EmpleadoDistribucionItem"

    UsuarioResumenResponse:
      type: object
      required:
        - total_plantilla
        - activos
        - inactivos
        - sin_lider_asignado
        - practicantes
        - porcentaje_operatividad
        - colaboradores_total
        - contratos_por_vencer
        - empleados_por_clasificacion_y_area
      properties:
        total_plantilla:
          type: integer
        activos:
          type: integer
        inactivos:
          type: integer
        sin_lider_asignado:
          type: integer
        sin_email_administrativo:
          type: integer
          description: Administrativos activos sin correo en empleado ni tabla emails
        practicantes:
          type: integer
        porcentaje_operatividad:
          type: number
          format: float
        colaboradores_total:
          type: integer
        contratos_por_vencer:
          type: integer
        empleados_por_clasificacion_y_area:
          type: array
          items:
            $ref: "#/components/schemas/EmpleadosPorClasificacionAreaSerie"

    CatalogoFiltrosResponse:
      type: object
      required: [areas, puestos]
      properties:
        areas:
          type: array
          items:
            $ref: "#/components/schemas/AreaResponse"
        puestos:
          type: array
          items:
            $ref: "#/components/schemas/PuestoResponse"

    SolicitudBrief:
      type: object
      required: [id, tipo, estado, fecha_inicio, fecha_fin, created_at]
      properties:
        id:
          type: integer
        tipo:
          type: string
        estado:
          type: string
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    IncidenciaBrief:
      type: object
      required: [id, tipo, created_at]
      properties:
        id:
          type: integer
        tipo:
          type: string
        estatus_id:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time

    ActaBrief:
      type: object
      required: [id, estado, created_at]
      properties:
        id:
          type: integer
        estado:
          type: string
        created_at:
          type: string
          format: date-time

    Vista360TurnoEmpleado:
      type: object
      description: Datos de turnos_empleados; la API solo lo incluye cuando el solicitante tiene rol rh.
      properties:
        comedor:
          type: string
          nullable: true
          description: Valor de la columna comedor (entero en BD, serializado como texto).
        turno:
          type: string
          nullable: true

    VacacionesResponse:
      type: object
      required:
        - empleado_id
        - dias_disponibles
      properties:
        empleado_id:
          type: integer
        dias_disponibles:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
          nullable: true

    VacacionesUpdate:
      type: object
      required:
        - dias_disponibles
      properties:
        dias_disponibles:
          type: integer
          minimum: 0
          description: Saldo de días de vacaciones disponibles

    UsuarioVista360Response:
      type: object
      required:
        - usuario
        - solicitudes_recientes
        - incidencias_activas
        - actas_firmadas
        - saldo_vacaciones
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioResponse"
        solicitudes_recientes:
          type: array
          items:
            $ref: "#/components/schemas/SolicitudBrief"
        incidencias_activas:
          type: array
          items:
            $ref: "#/components/schemas/IncidenciaBrief"
        actas_firmadas:
          type: array
          items:
            $ref: "#/components/schemas/ActaBrief"
        saldo_vacaciones:
          type: integer
        turno_empleado:
          allOf:
            - $ref: "#/components/schemas/Vista360TurnoEmpleado"
          nullable: true
          description: Presente solo para rol rh; ausente o null para otros roles.

    MetricasUsuarioResponse:
      type: object
      required:
        - solicitudes_por_estado
        - incidencias_por_tipo
        - dias_antiguedad
        - total_actas
      properties:
        solicitudes_por_estado:
          type: object
          additionalProperties:
            type: integer
        incidencias_por_tipo:
          type: object
          additionalProperties:
            type: integer
        dias_antiguedad:
          type: integer
        total_actas:
          type: integer

    ActasPageResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActaResponse"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    # ── Solicitudes ───────────────────────────────────
    SolicitudCreate:
      type: object
      required: [tipo, fecha_inicio, fecha_fin]
      properties:
        tipo:
          type: string
          enum: [vacaciones, home_office, matrimonio, incapacidad_interna, defuncion, paternidad, permiso_sin_goce_sueldo]
          description: >
            Tipos especiales (`matrimonio`, `incapacidad_interna`, `defuncion`, `paternidad`)
            solo pueden ser creados por RH. Reglas automáticas:
            matrimonio=2 días, defuncion=3 días, paternidad=7 días hábiles,
            incapacidad_interna con duración manual.
            El tipo `permiso_sin_goce_sueldo` solo puede crearlo supervisor, gerente,
            RH o director, y requiere `motivo`.
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
          description: Debe ser >= fecha_inicio
        motivo:
          type: [string, "null"]
          description: Obligatorio cuando `tipo=permiso_sin_goce_sueldo`.
        comentarios:
          type: [string, "null"]
        empleado_id:
          type: integer
          nullable: true
          description: >
            ID del colaborador titular. Si se omite o coincide con el usuario autenticado,
            la solicitud es propia. Supervisor/gerente/RH/director pueden indicar un colaborador
            dentro de su alcance.

    SolicitudResponse:
      type: object
      required:
        - id
        - empleado_id
        - tipo
        - fecha_inicio
        - fecha_fin
        - estado
        - nivel_actual
        - motivo
        - comentarios
        - created_at
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        tipo:
          type: string
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        estado:
          type: string
          enum: [pending, approved, rejected, cancelled, overridden, changes_requested]
        nivel_actual:
          type: integer
        motivo:
          type: [string, "null"]
        comentarios:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        empleado_nombre:
          type: string
          default: ""
        empleado_no_empleado:
          type: [string, "null"]
        empleado_area:
          type: [string, "null"]
        empleado_puesto:
          type: [string, "null"]
        empleado_foto:
          type: [string, "null"]
        lider_id:
          type: [integer, "null"]
          description: empleado_id del líder inmediato
        lider_nombre:
          type: [string, "null"]
        gerente_linea_id:
          type: [integer, "null"]
        gerente_linea_nombre:
          type: [string, "null"]
        supervisor_aprobo:
          type: boolean
          default: false
        pendiente_aprobacion_supervisor:
          type: boolean
          default: false
        pendiente_aprobacion_gerente:
          type: boolean
          default: false

    SolicitudAprobacionCreate:
      type: object
      required: [accion, nivel]
      properties:
        accion:
          type: string
          enum: [approve, reject, override, request_changes]
        nivel:
          type: integer
        comentario:
          type: [string, "null"]

    SolicitudSolicitarCambiosBody:
      type: object
      required: [comentario]
      properties:
        nivel:
          type: integer
          default: 1
        comentario:
          type: string
          minLength: 1

    SolicitudRequisitorRevision:
      type: object
      required: [fecha_inicio, fecha_fin]
      properties:
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
          description: Debe ser >= fecha_inicio
        comentarios:
          type: [string, "null"]

    SolicitudAprobacionResponse:
      type: object
      required: [id, solicitud_id, aprobador_id, accion, nivel, timestamp]
      properties:
        id:
          type: integer
        solicitud_id:
          type: integer
        aprobador_id:
          type: integer
        accion:
          type: string
        nivel:
          type: integer
        comentario:
          type: [string, "null"]
        timestamp:
          type: string
          format: date-time
        aprobador_nombre:
          type: string
          default: ""

    PaginatedSolicitudResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SolicitudResponse"
        next_cursor:
          type: [integer, "null"]
        total:
          type: integer

    # ── Incidencias ───────────────────────────────────
    IncidenciaCreate:
      type: object
      required: [empleado_id, tipo]
      properties:
        empleado_id:
          type: integer
        tipo:
          type: string
        no_empleado:
          type: [string, "null"]
        nombre:
          type: [string, "null"]
        fecha:
          type: [string, "null"]
          format: date
        categoria:
          type: [string, "null"]
        detalle:
          type: [string, "null"]
        area:
          type: [string, "null"]
        subarea:
          type: [string, "null"]
        origen:
          type: string
          enum: [manual, bono]
          default: manual

    IncidenciaResponse:
      type: object
      required: [id, empleado_id, tipo, created_at, updated_at]
      properties:
        id:
          type: integer
        empleado_id:
          type: integer
        tipo:
          type: string
        subtipo:
          type: [string, "null"]
        no_empleado:
          type: [string, "null"]
        nombre:
          type: [string, "null"]
        fecha:
          type: [string, "null"]
          format: date
        categoria:
          type: [string, "null"]
        detalle:
          type: [string, "null"]
        area:
          type: [string, "null"]
        subarea:
          type: [string, "null"]
        origen:
          type: string
          description: >
            Procedencia del registro (p. ej. manual, calidad_historico, seguridad_historico).
        origen_id:
          type: [integer, "null"]
          description: >
            Identificador en la tabla de origen (p. ej. calidad_historico.id). Null en incidencias manuales.
        synced_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        evidencias_count:
          type: integer
          default: 0
        puesto:
          type: [string, "null"]
          description: Descripción de puesto desde catálogo empleados (por no_empleado o empleado_id).
        supervisor_directo:
          type: [string, "null"]
          description: Nombre del líder directo desde tabla empleados.

    IncidenciasKpiResumen:
      type: object
      required: [abiertas, en_investigacion, resueltas, criticas]
      properties:
        abiertas:
          type: integer
        en_investigacion:
          type: integer
        resueltas:
          type: integer
        criticas:
          type: integer

    IncidenciasListPageResponse:
      type: object
      required: [items, total, page, page_size, resumen]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncidenciaResponse"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        resumen:
          $ref: "#/components/schemas/IncidenciasKpiResumen"

    IncidenciasTiposResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string

    IncidenciasAreasResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string

    IncidenciasSubareasResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string

    IncidenciaAreaTotalItem:
      type: object
      required: [area, total]
      properties:
        area:
          type: string
        total:
          type: integer

    IncidenciaSubareaTotalItem:
      type: object
      required: [subarea, total]
      properties:
        subarea:
          type: string
        total:
          type: integer
        area:
          type: [string, "null"]
          description: Área más frecuente asociada a la subárea en el conjunto filtrado (heurística).

    IncidenciaEmpleadoTotalItem:
      type: object
      required: [empleado_id, total]
      properties:
        empleado_id:
          type: integer
        no_empleado:
          type: [string, "null"]
        nombre:
          type: [string, "null"]
        total:
          type: integer

    IncidenciaTipoDistribucionItem:
      type: object
      required: [tipo, total, porcentaje]
      properties:
        tipo:
          type: string
        total:
          type: integer
        porcentaje:
          type: number

    IncidenciaSerieMensualItem:
      type: object
      required: [periodo, total]
      properties:
        periodo:
          type: string
          description: Mes calendario en formato YYYY-MM
        total:
          type: integer

    IncidenciaMesTipoItem:
      type: object
      required: [periodo, tipo, total]
      properties:
        periodo:
          type: string
          description: Mes calendario en formato YYYY-MM
        tipo:
          type: string
        total:
          type: integer

    IncidenciaPeriodoTipoItem:
      type: object
      required: [periodo, tipo, total]
      properties:
        periodo:
          type: string
          description: "Clave de periodo según tendencia_agrupacion (YYYY-MM-DD, lunes de semana o YYYY-MM)"
        tipo:
          type: string
        total:
          type: integer

    IncidenciasEstadisticasResponse:
      type: object
      required:
        - total_incidencias
        - incidencias_seguridad
        - incidencias_calidad
        - areas_con_mas_incidencias
        - subareas_con_mas_incidencias
        - empleados_con_mas_incidencias
        - incidencias_por_tipo
        - incidencias_por_mes
      properties:
        total_incidencias:
          type: integer
        incidencias_seguridad:
          type: integer
          description: Heurística por coincidencia de texto «seguridad» en categoría o tipo.
        incidencias_calidad:
          type: integer
          description: Heurística por coincidencia de texto «calidad» en categoría o tipo.
        areas_con_mas_incidencias:
          type: array
          items:
            $ref: "#/components/schemas/IncidenciaAreaTotalItem"
        subareas_con_mas_incidencias:
          type: array
          items:
            $ref: "#/components/schemas/IncidenciaSubareaTotalItem"
        empleados_con_mas_incidencias:
          type: array
          items:
            $ref: "#/components/schemas/IncidenciaEmpleadoTotalItem"
