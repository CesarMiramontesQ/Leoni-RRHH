      description: >
        Valores distintos de la columna `area` (vacíos como «(sin área)»), con el mismo alcance
        por rol que el listado principal. Excluye tipos internos `progresivo` y `progresivo_historico`.
      operationId: incidencias_areas_list
      security:
        - BearerAuth: []
