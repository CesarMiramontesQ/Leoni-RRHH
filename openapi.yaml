  /api/v1/comedor/turnos-comida:
    get:
      tags: [Comedor]
      summary: Turnos del catalogo con su ciclo desglosado (Ajustes Comedor)
      description: >-
        Un turno fijo trae su semana. uno rotativo, su ciclo completo agrupado en tramos
        con la misma jornada, de modo que 56 dias se leen como 28 bloques.
      operationId: comedor_turnos_comida_list
      security:
        - BearerAuth: []
      parameters:
        - name: incluir_inactivos
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Incluye los turnos con tu_activo distinto de "S"
        - name: solo_en_uso
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: >-
            Solo turnos con personal activo segun levelup_turnos_uso. Si la cache esta
            vacia no se filtra, y un turno con alguna jornada ya configurada nunca se
            oculta.
      responses:
        "200":
          description: Turnos ordenados por codigo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComedorTurnoComidaItem"
        "403":
          description: Sin permiso para el modulo comedor-ajustes

  /api/v1/comedor/jornadas-comida:
    get:
      tags: [Comedor]
      summary: Jornadas configurables con su ventana de comida (Ajustes Comedor)
      description: >-
        Es la unica superficie editable. La hora de comer depende de la jornada que toca
        ese dia, no del turno, porque un turno rotativo recorre varias.
      operationId: comedor_jornadas_comida_list
      security:
        - BearerAuth: []
      parameters:
        - name: solo_en_uso
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: >-
            Solo jornadas de turnos con personal activo. Mismas salvaguardas. cache vacia
            no filtra y una jornada ya configurada nunca se oculta.
      responses:
        "200":
          description: Jornadas ordenadas por codigo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComedorJornadaComidaItem"
        "403":
          description: Sin permiso para el modulo comedor-ajustes

  /api/v1/comedor/jornadas-comida/{ho_codigo}:
    put:
      tags: [Comedor]
      summary: Asignar o actualizar la ventana de comida de una jornada
      description: >-
        Afecta a todos los turnos que recorren esa jornada. la respuesta y la auditoria
        dejan constancia de cuales son.
      operationId: comedor_jornadas_comida_upsert
      security:
        - BearerAuth: []
      parameters:
        - name: ho_codigo
          in: path
          required: true
          schema:
            type: string
          description: Codigo de la jornada en levelup_horarios, sin relleno de espacios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComedorJornadaComidaUpsert"
      responses:
        "200":
          description: Jornada con su ventana actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComedorJornadaComidaItem"
        "403":
          description: Sin permiso para el modulo comedor-ajustes
        "404":
          description: La jornada no existe ni la referencia ningun turno del catalogo
        "422":
          description: Falta alguna hora, o la de inicio es igual a la de fin

  /api/v1/comedor/ventana-comida:
    get:
      tags: [Comedor]
      summary: Que comida le toca a una persona en una fecha
      description: >-
        Resuelve turno efectivo, posicion del ciclo, jornada y ventana. Cuando no hay
        ventana devuelve el motivo (descanso, jornada sin configurar, turno sin asignar)
        en vez de horas vacias.
      operationId: comedor_ventana_comida_get
      security:
        - BearerAuth: []
      parameters:
        - name: no_empleado
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Cualquier fecha, pasada o futura. no se asume la de hoy
      responses:
        "200":
          description: Resolucion de la ventana de comida
          content:
            application/json:
