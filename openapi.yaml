    get:
      tags: [Talento - Evaluaciones]
      summary: Empleados ligados a un perfil de puesto
      description: >-
        Lista los empleados con una asignacion activa a un perfil de puesto
        (PerfilFunciones), para el selector de "Evaluacion Individual vs Perfil
        Ideal". RH ve todos; supervisor solo su area; otro rol solo a si mismo.
