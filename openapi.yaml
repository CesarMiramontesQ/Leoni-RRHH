    get:
      tags: [Incidencias]
      summary: Listar tipos de incidencia registrados
      description: >
        Valores distintos de la columna `tipo` en la tabla de incidencias, respetando el mismo
        alcance por rol que el listado principal.
        Excluye `progresivo` y `progresivo_historico`.
      operationId: incidencias_tipos_list
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tipos ordenados alfabéticamente
