          maxLength: 255
        area_id:
          type: [integer, "null"]
        nivel:
          type: [string, "null"]
          maxLength: 50
        descripcion:
          type: [string, "null"]
        competencias_tecnicas:
          type: [object, "null"]
        habilidades_blandas:
          type: [object, "null"]
        maquinas_herramientas:
          type: [object, "null"]

    PuestoPerfilUpdate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 255
        area_id:
          type: [integer, "null"]
        nivel:
          type: [string, "null"]
          maxLength: 50
        descripcion:
          type: [string, "null"]
        competencias_tecnicas:
          type: [object, "null"]
        habilidades_blandas:
          type: [object, "null"]
        maquinas_herramientas:
          type: [object, "null"]

    PerfilTarjetaItem:
