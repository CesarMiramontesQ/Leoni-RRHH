      description: Empleado ve las propias; supervisor ve su area; RH ve todas.
      operationId: evaluaciones_by_empleado
      security:
        - BearerAuth: []
      parameters:
        - name: empleado_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Lista de evaluaciones del empleado
