  # ── Talento — Perfil de Funciones (buscar empleados para asignar) ──
  /api/v1/perfiles/empleados-disponibles:
    get:
      tags: [Talento - Perfil Funciones]
      summary: Buscar empleados activos sin asignación de perfil
      description: >-
        Buscador del modal "Asignar empleado". Devuelve empleados activos que no
        tienen una asignación de perfil activa, filtrando por nombre o número de
        empleado (mínimo 2 caracteres). Accesible con el módulo "puestos" (bypass
        por módulo del guard de rol).
      operationId: buscar_empleados_disponibles_perfil
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Nombre o número de empleado (mínimo 2 caracteres)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Empleados disponibles (lista vacía si q < 2 caracteres)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmpleadoDisponibleResponse"
        "403":
          description: Sin módulo "puestos" ni rol suficiente

