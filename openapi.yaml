        aprobador_id: { type: integer, nullable: true }
        estado_aprobacion:
          type: string
          enum: [borrador, revision, aprobada]
          nullable: true
          description: Ignorado por el service; el estado se mueve por el workflow.
    OPLVersionAgregar:
      type: object
      required: [archivo_url]
      properties:
        archivo_url: { type: string, minLength: 1, maxLength: 500 }
        cambios_descripcion: { type: string, nullable: true }
    OPLVersionItem:
      type: object
      properties:
        id: { type: integer }
        version_num: { type: integer }
        archivo_url: { type: string }
        cambios_descripcion: { type: string, nullable: true }
        fecha: { type: string, format: date-time }
        creado_por_id: { type: integer, nullable: true }
        creado_por_nombre: { type: string, nullable: true }
    OPLConVersionesResponse:
      type: object
      properties:
