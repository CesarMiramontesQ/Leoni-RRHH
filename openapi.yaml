      properties:
        celdas:
          type: array
          items:
            $ref: "#/components/schemas/MatrizCelda"

    ResumenAreaResponse:
      type: object
      required: [area_id, total_empleados, total_puestos_perfil, total_competencias, requisitos_activos, cumplimiento_porcentaje]
      properties:
        area_id:
          type: integer
        area_nombre:
          type: [string, "null"]
        total_empleados:
          type: integer
        total_puestos_perfil:
          type: integer
        total_competencias:
          type: integer
        requisitos_activos:
          type: integer
        cumplimiento_porcentaje:
          type: number
          format: float

    BrechaItem:
      type: object
      required: [competencia_id, competencia_nombre, categoria, nivel_requerido_promedio, gap_porcentaje, empleados_afectados]
      properties:
        competencia_id:
          type: integer
        competencia_nombre:
          type: string
        categoria:
          type: string
        nivel_requerido_promedio:
          type: number
          format: float
        gap_porcentaje:
          type: number
          format: float
        empleados_afectados:
          type: integer

    BrechasResponse:
      type: object
      required: [area_id, brechas]
      properties:
        area_id:
          type: integer
        area_nombre:
          type: [string, "null"]
        brechas:
          type: array
          items:
            $ref: "#/components/schemas/BrechaItem"

    # ── Talento — Puestos Perfil ──────────────────────
    PuestoPerfilCreate:
      type: object
      required: [nombre]
      properties:
        nombre:
