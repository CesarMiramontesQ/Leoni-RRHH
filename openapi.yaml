      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
        - name: asignacion_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluacionCompetenciaSyncBody"
      responses:
        "200":
          description: Gap analysis actualizado de la asignación
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Sin permisos
        "404":
          description: Perfil o asignación no encontrados
        "422":
          description: competencia_requisito_ids inválidos

