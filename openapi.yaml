                $ref: "#/components/schemas/PerfilCualificacionResponse"
    delete:
      tags: [Talento - Perfil Funciones]
      summary: Eliminar cualificación del perfil
      operationId: eliminar_perfil_cualificacion
      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
        - name: cualificacion_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cualificación eliminada

  /api/v1/perfiles/{perfil_id}/asignaciones/{asignacion_id}:
    patch:
      tags: [Talento - Perfil Funciones]
      summary: Actualizar metadatos de asignación (p. ej. grado)
      operationId: actualizar_asignacion_perfil
      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
        - name: asignacion_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grado_id:
                  type: integer
                  minimum: 1
                departamento:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Asignación actualizada
        "403":
          description: Sin permisos
        "404":
          description: Asignación no encontrada
    put:
      tags: [Talento - Perfil Funciones]
      summary: Actualizar evaluaciones de cualificación y competencia
      description: Actualiza valor_capturado por cualificación; el backend calcula cumple vía comparador genérico.
      operationId: actualizar_evaluaciones_asignacion
      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
        - name: asignacion_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarEvaluacionesBody"
      responses:
        "200":
          description: Gap analysis actualizado

  /api/v1/perfiles/{perfil_id}/competencias:
    get:
      tags: [Talento - Perfil Funciones]
      summary: Listar competencias requeridas del perfil por grado
      operationId: listar_perfil_competencias
      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
        - name: grado_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lista de competencias del grado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerfilCompetenciaResponse"
    post:
      tags: [Talento - Perfil Funciones]
      summary: Agregar competencia del catálogo al perfil
      description: Crea la relación puesto-competencia con nivel mínimo requerido (1-4). Solo RH o supervisor.
      operationId: crear_perfil_competencia
      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilCompetenciaCreate"
      responses:
        "201":
          description: Competencia asociada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilCompetenciaResponse"
        "403":
          description: Sin permisos
        "404":
          description: Perfil o competencia no encontrado
        "409":
          description: Competencia ya asignada al perfil
        "422":
          description: Validación (nivel_requerido obligatorio 1-4)

  /api/v1/perfiles/{perfil_id}/competencias/{requisito_id}:
    patch:
      tags: [Talento - Perfil Funciones]
      summary: Actualizar nivel mínimo requerido de una competencia del perfil
      operationId: actualizar_nivel_perfil_competencia
      security:
        - BearerAuth: []
      parameters:
        - name: perfil_id
          in: path
          required: true
          schema:
            type: integer
        - name: requisito_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilCompetenciaUpdate"
      responses:
        "200":
          description: Requisito actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilCompetenciaResponse"
        "403":
