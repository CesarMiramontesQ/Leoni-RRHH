        versiones:
          type: array
          items:
            $ref: "#/components/schemas/OPLVersionItem"
        version_actual:
          allOf:
            - $ref: "#/components/schemas/OPLVersionItem"
          nullable: true
        total_versiones: { type: integer, default: 0 }
