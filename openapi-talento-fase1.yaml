  # ── Matriz de Competencias ───────────────────────────────

  /api/v1/competencias/matriz:
    get:
      tags: [Competencias]
      summary: Obtener vista de matriz de competencias
      description: >
        Retorna la grilla completa de la matriz: filas = competencias,
        columnas = perfiles de puesto del area seleccionada. Cada celda
        contiene el nivel requerido (0-4). Filtrable por area y categoria.
        Roles permitidos: rh, director, gerente, supervisor.
      operationId: competencias_matriz_get
      security:
        - BearerAuth: []
      parameters:
        - name: area_id
          in: query
          required: true
          description: ID del area para filtrar la matriz
          schema:
            type: integer
        - name: categoria
          in: query
          description: Filtrar filas por categoria de competencia
          schema:
            type: string
            enum: [tecnica, blanda]
        - name: linea
          in: query
          description: Filtrar por linea/sector dentro del area (ej. "A-1", "B-2")
          schema:
            type: string
            maxLength: 50
      responses:
        "200":
          description: Vista de matriz completa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrizView"
              example:
                area_id: 5
                area_nombre: "Calidad"
                columnas:
                  - puesto_perfil_id: 12
                    puesto_perfil_nombre: "Auditor de Calidad Nivel 2"
                    puesto_perfil_codigo: "PRF-2026-001"
                  - puesto_perfil_id: 13
                    puesto_perfil_nombre: "Inspector de Calidad"
                    puesto_perfil_codigo: "PRF-2026-002"
                  - puesto_perfil_id: 14
                    puesto_perfil_nombre: "Supervisor de Calidad"
                    puesto_perfil_codigo: "PRF-2026-003"
                filas:
                  - competencia_id: 8
                    competencia_nombre: "Auditoria IATF 16949"
                    categoria: "tecnica"
                    niveles:
                      - puesto_perfil_id: 12
                        puesto_perfil_nombre: "Auditor de Calidad Nivel 2"
                        nivel: 4
                      - puesto_perfil_id: 13
                        puesto_perfil_nombre: "Inspector de Calidad"
                        nivel: 2
                      - puesto_perfil_id: 14
                        puesto_perfil_nombre: "Supervisor de Calidad"
                        nivel: 3
                  - competencia_id: 9
                    competencia_nombre: "Metrologia dimensional"
                    categoria: "tecnica"
                    niveles:
                      - puesto_perfil_id: 12
                        puesto_perfil_nombre: "Auditor de Calidad Nivel 2"
                        nivel: 3
                      - puesto_perfil_id: 13
                        puesto_perfil_nombre: "Inspector de Calidad"
                        nivel: 4
                      - puesto_perfil_id: 14
                        puesto_perfil_nombre: "Supervisor de Calidad"
                        nivel: 2
                total_competencias: 15
                total_puestos: 3
        "400":
          description: area_id es requerido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Competencias]
      summary: Actualizar matriz de competencias (bulk)
      description: >
        Actualiza multiples celdas de la matriz en una sola operacion.
        Cada celda se identifica por competencia_id + puesto_perfil_id.
        Si nivel = 0, el requisito se elimina (la celda queda vacia/N/A).
        Maximo 500 celdas por request. Roles permitidos: rh.
      operationId: competencias_matriz_update
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatrizBulkUpdateRequest"
            example:
              requisitos:
                - competencia_id: 8
                  puesto_perfil_id: 12
                  nivel: 4
                - competencia_id: 8
                  puesto_perfil_id: 13
                  nivel: 2
                - competencia_id: 9
                  puesto_perfil_id: 12
                  nivel: 3
                - competencia_id: 10
                  puesto_perfil_id: 14
                  nivel: 0
      responses:
        "200":
          description: Matriz actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrizBulkUpdateResponse"
              example:
                actualizados: 2
                creados: 1
                eliminados: 1
        "400":
          description: IDs invalidos (competencia o perfil no existen)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos (solo RH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Error de validacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

