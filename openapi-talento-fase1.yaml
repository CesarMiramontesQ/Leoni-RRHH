            type: integer
        - name: categoria
          in: query
          description: Filtrar por categoria de competencia
          schema:
            type: string
            enum: [tecnica, blanda]
        - name: umbral_minimo
          in: query
          description: Solo brechas con porcentaje >= este umbral (default 10)
          schema:
            type: number
            format: float
            default: 10
            minimum: 0
            maximum: 100
        - name: limit
