  /api/v1/puestos-perfil/{id}/generar-ia:
    post:
      tags: [Perfiles de Puesto]
      summary: Generar descripcion y competencias con IA
      description: >
        Utiliza integracion con Ollama LLM para generar automaticamente la
        descripcion del puesto y sugerir competencias tecnicas/habilidades blandas
        basandose en el nombre, nivel y area del perfil. Las sugerencias NO se
        guardan automaticamente — el usuario debe revisar y confirmar via PUT.
        Roles permitidos: rh.
      operationId: puestos_perfil_generar_ia
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del perfil de puesto sobre el cual generar
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAGeneracionRequest"
            example:
              contexto_adicional: "Industria automotriz, normas IATF 16949, produccion en 3 turnos."
              regenerar_descripcion: true
              regenerar_competencias: true
      responses:
        "200":
          description: Sugerencias generadas por IA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAGeneracionResponse"
              example:
                descripcion_generada: "Profesional responsable de supervisar y coordinar las operaciones de la linea A-1, asegurando el cumplimiento de metas de produccion, estandares de calidad IATF 16949 y seguridad industrial."
                competencias_tecnicas_sugeridas:
                  - nombre: "Gestion de produccion automotriz"
                    descripcion: "Planificacion y control de produccion en linea de cable automotriz"
                    nivel_requerido: 4
                  - nombre: "IATF 16949"
                    descripcion: "Conocimiento y aplicacion de la norma de calidad automotriz"
                    nivel_requerido: 3
                  - nombre: "Lean Manufacturing"
                    descripcion: "Aplicacion de 5S, Kaizen, VSM en piso de produccion"
                    nivel_requerido: 3
                habilidades_blandas_sugeridas:
                  - nombre: "Liderazgo de equipos"
                    nivel_requerido: 4
                  - nombre: "Comunicacion efectiva"
                    nivel_requerido: 3
                  - nombre: "Toma de decisiones bajo presion"
                    nivel_requerido: 3
                maquinas_herramientas_sugeridas:
                  - nombre: "Extrusora de cable"
                    requiere_certificacion: true
                  - nombre: "Sistema MES/ERP"
                    requiere_certificacion: false
                modelo_utilizado: "llama3:8b"
                tokens_utilizados: 1250
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos (solo RH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Servicio de IA no disponible (Ollama no responde)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: "Servicio de IA no disponible. Intente mas tarde."

  # ══════════════════════════════════════════════════════════
  # COMPETENCIAS
  # ══════════════════════════════════════════════════════════

  /api/v1/competencias/:
    get:
      tags: [Competencias]
      summary: Listar competencias (paginado, filtrable)
      description: >
        Catalogo de competencias tecnicas y blandas. Filtrable por categoria,
        area y texto libre. Roles permitidos: rh, director, gerente, supervisor.
      operationId: competencias_list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero de pagina
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Elementos por pagina
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: categoria
          in: query
          description: Filtrar por categoria
          schema:
            type: string
            enum: [tecnica, blanda]
        - name: area_id
          in: query
          description: Filtrar por area (null = transversales)
          schema:
            type: integer
        - name: q
          in: query
          description: Busqueda por nombre de la competencia
          schema:
            type: string
            maxLength: 100
        - name: activo
          in: query
          description: Filtrar por estado activo/inactivo
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Lista paginada de competencias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetenciaList"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Competencias]
      summary: Crear competencia
      description: >
        Crea una nueva competencia tecnica o blanda en el catalogo. Si area_id
        es null, se considera una competencia transversal. Roles permitidos: rh.
      operationId: competencias_create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetenciaCreate"
            example:
              nombre: "Control estadistico de procesos (SPC)"
              descripcion: "Aplicacion de herramientas estadisticas para monitoreo y control de procesos de manufactura."
              categoria: "tecnica"
              area_id: 3
      responses:
        "201":
          description: Competencia creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetenciaResponse"
        "400":
          description: Datos invalidos (ej. nombre duplicado en la misma area)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos (solo RH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Error de validacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

