openapi: 3.1.0
info:
  title: Plataforma RH Leoni Cable — Modulo Talento (Fase 1)
  description: >
    Especificacion para el modulo de Talento fase 1: Perfiles de Puesto y
    Matriz de Competencias. Desarrollo spec-driven — esta spec se implementa
    contra el backend FastAPI existente.
  version: 0.1.0
  contact:
    name: Leoni Cable - Equipo de Desarrollo

servers:
  - url: http://localhost:8000
    description: Desarrollo local (Docker)

tags:
  - name: Perfiles de Puesto
    description: CRUD de perfiles de puesto con competencias tecnicas, habilidades blandas, maquinaria y generacion IA
  - name: Competencias
    description: Catalogo de competencias, matriz de asignacion por puesto, resumen de area y brechas criticas

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Perfiles de Puesto ─────────────────────────────────

    CompetenciaTecnicaItem:
      type: object
      required: [nombre, nivel_requerido]
      properties:
        nombre:
          type: string
          example: "Soldadura MIG/MAG"
        descripcion:
          type: string
          example: "Capacidad para realizar soldadura de cable automotriz con equipo MIG/MAG"
        nivel_requerido:
          type: integer
          minimum: 0
          maximum: 4
          description: "0=N/A, 1=Basico, 2=Intermedio, 3=Avanzado, 4=Experto"
          example: 3

    HabilidadBlandaItem:
      type: object
      required: [nombre, nivel_requerido]
      properties:
        nombre:
          type: string
          example: "Liderazgo"
        nivel_requerido:
          type: integer
          minimum: 0
          maximum: 4
          description: "0=N/A, 1=Basico, 2=Intermedio, 3=Avanzado, 4=Experto"
          example: 3

    MaquinaHerramientaItem:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          example: "Cortadora laser CNC"
        requiere_certificacion:
          type: boolean
          default: false
          example: true

    PuestoPerfilCreate:
      type: object
      required: [nombre, area_id, nivel]
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 200
          example: "Auditor de Calidad Nivel 2"
        area_id:
          type: integer
          example: 5
        nivel:
          type: string
          enum: [operativo, tecnico, supervisor, gerencia, direccion]
          example: "tecnico"
        descripcion:
          type: string
          maxLength: 2000
          example: "Responsable de auditar procesos de calidad en lineas de produccion de cable automotriz, asegurando cumplimiento de normas IATF 16949."
        competencias_tecnicas:
          type: array
          items:
            $ref: "#/components/schemas/CompetenciaTecnicaItem"
          default: []
        habilidades_blandas:
          type: array
          items:
            $ref: "#/components/schemas/HabilidadBlandaItem"
          default: []
        maquinas_herramientas:
          type: array
          items:
            $ref: "#/components/schemas/MaquinaHerramientaItem"
          default: []

    PuestoPerfilUpdate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 200
        area_id:
          type: integer
        nivel:
          type: string
          enum: [operativo, tecnico, supervisor, gerencia, direccion]
        descripcion:
          type: string
          maxLength: 2000
        competencias_tecnicas:
          type: array
          items:
            $ref: "#/components/schemas/CompetenciaTecnicaItem"
        habilidades_blandas:
          type: array
          items:
            $ref: "#/components/schemas/HabilidadBlandaItem"
        maquinas_herramientas:
          type: array
          items:
            $ref: "#/components/schemas/MaquinaHerramientaItem"

    PuestoPerfilResponse:
      type: object
      required:
        - id
        - codigo
        - nombre
        - area_id
        - nivel
        - version
        - activo
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 12
        codigo:
          type: string
          description: "Codigo unico con formato PRF-YYYY-NNN"
          example: "PRF-2026-001"
        nombre:
          type: string
          example: "Auditor de Calidad Nivel 2"
        area_id:
          type: integer
          example: 5
        area_nombre:
          type: string
          example: "Calidad"
        nivel:
          type: string
          enum: [operativo, tecnico, supervisor, gerencia, direccion]
          example: "tecnico"
        descripcion:
          type: [string, "null"]
          example: "Responsable de auditar procesos de calidad en lineas de produccion de cable automotriz."
        competencias_tecnicas:
          type: array
          items:
            $ref: "#/components/schemas/CompetenciaTecnicaItem"
        habilidades_blandas:
          type: array
          items:
            $ref: "#/components/schemas/HabilidadBlandaItem"
        maquinas_herramientas:
          type: array
          items:
            $ref: "#/components/schemas/MaquinaHerramientaItem"
        version:
          type: integer
          minimum: 1
          example: 2
        activo:
          type: boolean
          example: true
        updated_by:
          type: [integer, "null"]
          description: "ID del empleado que realizo la ultima actualizacion"
          example: 45
        updated_by_nombre:
          type: [string, "null"]
          example: "Maria Garcia Lopez"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PuestoPerfilList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PuestoPerfilResponse"
        total:
          type: integer
          example: 47
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20

    IAGeneracionRequest:
      type: object
      properties:
        contexto_adicional:
          type: string
          maxLength: 1000
          description: "Contexto opcional para guiar la generacion (ej. enfoque en normas IATF, industria automotriz)"
          example: "Enfocado en produccion automotriz, normas IATF 16949, trabajo en turnos rotativos."
        regenerar_descripcion:
          type: boolean
          default: true
          description: "Si true, genera/reemplaza la descripcion del puesto"
        regenerar_competencias:
          type: boolean
          default: true
          description: "Si true, genera/reemplaza competencias tecnicas y habilidades blandas sugeridas"

    IAGeneracionResponse:
      type: object
      required: [descripcion_generada, competencias_tecnicas_sugeridas, habilidades_blandas_sugeridas, modelo_utilizado]
      properties:
        descripcion_generada:
          type: [string, "null"]
          example: "Profesional encargado de ejecutar auditorias de calidad en procesos de manufactura de cable automotriz, verificando cumplimiento de estandares IATF 16949 y VDA 6.3."
        competencias_tecnicas_sugeridas:
          type: array
          items:
            $ref: "#/components/schemas/CompetenciaTecnicaItem"
        habilidades_blandas_sugeridas:
          type: array
          items:
            $ref: "#/components/schemas/HabilidadBlandaItem"
        maquinas_herramientas_sugeridas:
          type: array
          items:
            $ref: "#/components/schemas/MaquinaHerramientaItem"
        modelo_utilizado:
          type: string
          description: "Modelo de Ollama utilizado"
          example: "llama3:8b"
        tokens_utilizados:
          type: [integer, "null"]
          example: 1250

    # ── Competencias ───────────────────────────────────────

    CompetenciaCreate:
      type: object
      required: [nombre, categoria]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 200
          example: "Soldadura MIG/MAG"
        descripcion:
          type: string
          maxLength: 1000
          example: "Dominio de tecnicas de soldadura por arco con gas protector para uniones de cable automotriz."
        categoria:
          type: string
          enum: [tecnica, blanda]
          example: "tecnica"
        area_id:
          type: [integer, "null"]
          description: "Si null, la competencia es transversal (aplica a todas las areas)"
          example: 3

    CompetenciaUpdate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 200
        descripcion:
          type: string
          maxLength: 1000
        categoria:
          type: string
          enum: [tecnica, blanda]
        area_id:
          type: [integer, "null"]

    CompetenciaResponse:
      type: object
      required: [id, nombre, categoria, activo, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 8
        nombre:
          type: string
          example: "Soldadura MIG/MAG"
        descripcion:
          type: [string, "null"]
          example: "Dominio de tecnicas de soldadura por arco con gas protector."
        categoria:
          type: string
          enum: [tecnica, blanda]
          example: "tecnica"
        area_id:
          type: [integer, "null"]
          example: 3
        area_nombre:
          type: [string, "null"]
          example: "Produccion"
        activo:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CompetenciaList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompetenciaResponse"
        total:
          type: integer
          example: 34
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 50

    # ── Matriz de Competencias ─────────────────────────────

    CompetenciaRequisito:
      type: object
      required: [competencia_id, puesto_perfil_id, nivel]
      properties:
        competencia_id:
          type: integer
          example: 8
        puesto_perfil_id:
          type: integer
          example: 12
        nivel:
          type: integer
          minimum: 0
          maximum: 4
          description: "0=N/A, 1=Basico, 2=Intermedio, 3=Avanzado, 4=Experto"
          example: 3

    MatrizCelda:
      type: object
      required: [puesto_perfil_id, nivel]
      properties:
        puesto_perfil_id:
          type: integer
          example: 12
        puesto_perfil_nombre:
          type: string
          example: "Auditor de Calidad Nivel 2"
        nivel:
          type: integer
          minimum: 0
          maximum: 4
          example: 3

    MatrizFila:
      type: object
      required: [competencia_id, competencia_nombre, categoria, niveles]
      properties:
        competencia_id:
          type: integer
          example: 8
        competencia_nombre:
          type: string
          example: "Soldadura MIG/MAG"
        categoria:
          type: string
          enum: [tecnica, blanda]
          example: "tecnica"
        niveles:
          type: array
          description: "Una celda por cada puesto/perfil (columna) del area filtrada"
          items:
            $ref: "#/components/schemas/MatrizCelda"

    MatrizColumna:
      type: object
      required: [puesto_perfil_id, puesto_perfil_nombre, puesto_perfil_codigo]
      properties:
        puesto_perfil_id:
          type: integer
          example: 12
        puesto_perfil_nombre:
          type: string
          example: "Auditor de Calidad Nivel 2"
        puesto_perfil_codigo:
          type: string
          example: "PRF-2026-001"

    MatrizView:
      type: object
      required: [area_id, area_nombre, columnas, filas]
      properties:
        area_id:
          type: integer
          example: 5
        area_nombre:
          type: string
          example: "Calidad"
        columnas:
          type: array
          description: "Encabezados de columna — los puestos/perfiles del area"
          items:
            $ref: "#/components/schemas/MatrizColumna"
        filas:
          type: array
          description: "Filas de la matriz — una por competencia"
          items:
            $ref: "#/components/schemas/MatrizFila"
        total_competencias:
          type: integer
          example: 15
        total_puestos:
          type: integer
          example: 6

    MatrizBulkUpdateRequest:
      type: object
      required: [requisitos]
      properties:
        requisitos:
          type: array
          minItems: 1
          maxItems: 500
          description: "Lista de celdas a actualizar. Nivel 0 elimina el requisito."
          items:
            $ref: "#/components/schemas/CompetenciaRequisito"

    MatrizBulkUpdateResponse:
      type: object
      required: [actualizados, creados, eliminados]
      properties:
        actualizados:
          type: integer
          description: "Requisitos existentes cuyo nivel cambio"
          example: 8
        creados:
          type: integer
          description: "Requisitos nuevos creados (nivel > 0)"
          example: 3
        eliminados:
          type: integer
          description: "Requisitos eliminados (nivel establecido en 0)"
          example: 1

    # ── Resumen de Area ────────────────────────────────────

    ResumenArea:
      type: object
      required:
        - area_id
        - area_nombre
        - porcentaje_cumplimiento
        - total_empleados
        - total_requisitos_activos
        - total_competencias
        - total_puestos_perfil
      properties:
        area_id:
          type: integer
          example: 5
        area_nombre:
          type: string
          example: "Calidad"
        porcentaje_cumplimiento:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: "Porcentaje promedio de cumplimiento de competencias en el area"
          example: 78.5
        total_empleados:
          type: integer
          description: "Empleados activos en el area"
          example: 42
        total_requisitos_activos:
          type: integer
          description: "Numero total de celdas de matriz con nivel > 0"
          example: 156
        total_competencias:
          type: integer
          description: "Competencias distintas asignadas en el area"
          example: 18
        total_puestos_perfil:
          type: integer
          description: "Perfiles de puesto activos en el area"
          example: 7
        brechas_criticas:
          type: array
          description: "Top 5 brechas con mayor porcentaje de incumplimiento"
          items:
            $ref: "#/components/schemas/BrechaItem"

    BrechaItem:
      type: object
      required: [competencia_id, competencia_nombre, categoria, porcentaje_brecha, empleados_sin_nivel]
      properties:
        competencia_id:
          type: integer
          example: 8
        competencia_nombre:
          type: string
          example: "Soldadura MIG/MAG"
        categoria:
          type: string
          enum: [tecnica, blanda]
          example: "tecnica"
        porcentaje_brecha:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: "Porcentaje de empleados que no alcanzan el nivel requerido"
          example: 35.7
        empleados_sin_nivel:
          type: integer
          description: "Numero de empleados que no cumplen el nivel requerido"
          example: 15
        nivel_promedio_actual:
          type: number
          format: float
          description: "Nivel promedio actual de los empleados en esta competencia"
          example: 1.8
        nivel_requerido_promedio:
          type: number
          format: float
          description: "Nivel promedio requerido por los perfiles del area"
          example: 3.2

    # ── Errores ────────────────────────────────────────────

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: "Perfil de puesto no encontrado"

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string

security:
  - BearerAuth: []

paths:
  # ══════════════════════════════════════════════════════════
  # PERFILES DE PUESTO
  # ══════════════════════════════════════════════════════════

  /api/v1/puestos-perfil/:
    get:
      tags: [Perfiles de Puesto]
      summary: Listar perfiles de puesto (paginado, filtrable)
      description: >
        Retorna lista paginada de perfiles de puesto. Filtrable por area, nivel y
        busqueda por texto. Roles permitidos: rh, director, gerente, supervisor.
      operationId: puestos_perfil_list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numero de pagina (inicia en 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Elementos por pagina
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: area_id
          in: query
          description: Filtrar por area
          schema:
            type: integer
        - name: nivel
          in: query
          description: Filtrar por nivel del puesto
          schema:
            type: string
            enum: [operativo, tecnico, supervisor, gerencia, direccion]
        - name: q
          in: query
          description: Busqueda por nombre o codigo del perfil
          schema:
            type: string
            maxLength: 100
        - name: activo
          in: query
          description: Filtrar por estado activo/inactivo (default true)
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Lista paginada de perfiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuestoPerfilList"
              example:
                items:
                  - id: 12
                    codigo: "PRF-2026-001"
                    nombre: "Auditor de Calidad Nivel 2"
                    area_id: 5
                    area_nombre: "Calidad"
                    nivel: "tecnico"
                    descripcion: "Responsable de auditar procesos de calidad."
                    competencias_tecnicas:
                      - nombre: "Auditoria IATF 16949"
                        descripcion: "Ejecucion de auditorias de proceso"
                        nivel_requerido: 3
                    habilidades_blandas:
                      - nombre: "Comunicacion efectiva"
                        nivel_requerido: 3
                    maquinas_herramientas:
                      - nombre: "Calibrador digital"
                        requiere_certificacion: false
                    version: 2
                    activo: true
                    updated_by: 45
                    updated_by_nombre: "Maria Garcia Lopez"
                    created_at: "2026-03-15T10:30:00Z"
                    updated_at: "2026-04-20T14:15:00Z"
                total: 47
                page: 1
                page_size: 20
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Perfiles de Puesto]
      summary: Crear perfil de puesto
      description: >
        Crea un nuevo perfil de puesto con competencias, habilidades y maquinaria.
        Se genera automaticamente un codigo PRF-YYYY-NNN secuencial.
        Roles permitidos: rh.
      operationId: puestos_perfil_create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuestoPerfilCreate"
            example:
              nombre: "Supervisor de Linea A-1"
              area_id: 3
              nivel: "supervisor"
              descripcion: "Supervisa operaciones de la linea A-1 de produccion de cable automotriz."
              competencias_tecnicas:
                - nombre: "Gestion de produccion"
                  descripcion: "Planificacion y control de produccion en linea"
                  nivel_requerido: 4
                - nombre: "Control estadistico de procesos"
                  descripcion: "SPC y graficos de control"
                  nivel_requerido: 3
              habilidades_blandas:
                - nombre: "Liderazgo"
                  nivel_requerido: 4
                - nombre: "Resolucion de conflictos"
                  nivel_requerido: 3
              maquinas_herramientas:
                - nombre: "Extrusora de cable"
                  requiere_certificacion: true
                - nombre: "Sistema MES"
                  requiere_certificacion: false
      responses:
        "201":
          description: Perfil creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuestoPerfilResponse"
        "400":
          description: Datos invalidos (ej. area_id no existe)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos (solo RH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Error de validacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /api/v1/puestos-perfil/{id}:
    get:
      tags: [Perfiles de Puesto]
      summary: Detalle de perfil de puesto
      description: >
        Retorna toda la informacion del perfil incluyendo competencias,
        habilidades, maquinaria y metadata de versionamiento.
        Roles permitidos: rh, director, gerente, supervisor.
      operationId: puestos_perfil_get
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del perfil de puesto
          schema:
            type: integer
      responses:
        "200":
          description: Perfil encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuestoPerfilResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Perfiles de Puesto]
      summary: Actualizar perfil de puesto
      description: >
        Actualiza parcial o totalmente el perfil. Incrementa automaticamente
        el numero de version y registra updated_by con el usuario actual.
        Roles permitidos: rh.
      operationId: puestos_perfil_update
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del perfil de puesto
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuestoPerfilUpdate"
            example:
              descripcion: "Supervisa operaciones de la linea A-1 de produccion, incluyendo control de calidad en proceso."
              competencias_tecnicas:
                - nombre: "Gestion de produccion"
                  descripcion: "Planificacion y control de produccion en linea"
                  nivel_requerido: 4
                - nombre: "Lean Manufacturing"
                  descripcion: "Aplicacion de metodologias lean"
                  nivel_requerido: 3
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuestoPerfilResponse"
        "400":
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos (solo RH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
