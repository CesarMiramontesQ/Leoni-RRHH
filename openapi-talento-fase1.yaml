                    categoria: "tecnica"
                    porcentaje_brecha: 35.7
                    empleados_sin_nivel: 15
                    nivel_promedio_actual: 1.8
                    nivel_requerido_promedio: 3.2
                  - competencia_id: 22
                    competencia_nombre: "Liderazgo de equipos"
                    categoria: "blanda"
                    porcentaje_brecha: 28.5
                    empleados_sin_nivel: 12
                    nivel_promedio_actual: 2.1
                    nivel_requerido_promedio: 3.0
                total: 12
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
