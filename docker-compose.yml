services:
  postgres:
    image: postgres:15-alpine
    container_name: leoni_rh_db
    environment:
      POSTGRES_DB: leoni_rh
      POSTGRES_USER: leoni
      POSTGRES_PASSWORD: leoni_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/dump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leoni -d leoni_rh"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      target: development
    container_name: leoni_rh_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://leoni:leoni_dev_pass@postgres:5432/leoni_rh
      APP_ENV: development
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.3}
      OLLAMA_HTTP_TIMEOUT: ${OLLAMA_HTTP_TIMEOUT:-180}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1536}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      # Chroma: evita intentos de telemetría fallidos en consola durante ingest/RAG
      ANONYMIZED_TELEMETRY: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: leoni_rh_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    container_name: leoni_rh_test
    volumes:
      - .:/app
    environment:
      APP_ENV: test
    profiles:
      - test

volumes:
  postgres_data:
    driver: local
