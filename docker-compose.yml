# BD única = Bono (PostgreSQL externo del cliente, fuera de Docker). No hay
# contenedor de BD local: el backend conecta a Bono vía host.docker.internal (BONO_DB_*).
services:
  backend:
    build:
      context: .
      target: development
    container_name: leoni_rh_backend
    # Si el Postgres de Bono corre en el host (p. ej. puerto 5433), usar
    # host.docker.internal como BONO_DB_HOST en `.env`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      # BD única = Bono. La conexión se toma EXCLUSIVAMENTE de `.env` (sin defaults
      # hardcodeados). El backend arma DATABASE_URL desde BONO_DB_*; DATABASE_URL
      # explícita es override opcional (password con caracteres especiales).
      DATABASE_URL: ${DATABASE_URL:-}
      BONO_DB_HOST: ${BONO_DB_HOST}
      BONO_DB_PORT: ${BONO_DB_PORT:-5433}
      BONO_DB_NAME: ${BONO_DB_NAME}
      BONO_DB_USER: ${BONO_DB_USER}
      BONO_DB_PASSWORD: ${BONO_DB_PASSWORD}
      BONO_DB_ENGINE: ${BONO_DB_ENGINE:-postgresql}
      APP_ENV: development
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.3}
      OLLAMA_HTTP_TIMEOUT: ${OLLAMA_HTTP_TIMEOUT:-180}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1536}
      OLLAMA_ACTA_NUM_PREDICT: ${OLLAMA_ACTA_NUM_PREDICT:-4096}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      # Chroma: evita intentos de telemetría fallidos en consola durante ingest/RAG
      ANONYMIZED_TELEMETRY: "false"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: leoni_rh_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    container_name: leoni_rh_test
    volumes:
      - .:/app
    environment:
      APP_ENV: test
    profiles:
      - test
