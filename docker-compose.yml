# DESARROLLO: incluye Postgres en Docker. No usar para probar producción V1.0.
# Producción (solo backend + frontend, BD externa):
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.mac.yml --env-file .env.prod.test up -d
# Proyecto Compose aislado: leoni-rh-dev (no comparte estado con leoni-rh-prod).
name: leoni-rh-dev

services:
  postgres:
    image: postgres:15-alpine
    container_name: leoni_rh_db_dev
    environment:
      POSTGRES_DB: leoni_rh
      POSTGRES_USER: leoni
      POSTGRES_PASSWORD: leoni_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/dump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leoni -d leoni_rh"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      target: development
    container_name: leoni_rh_backend
    # Postgres en el host (p. ej. puerto 5433): accesible sin `.env` en la máquina local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://leoni:leoni_dev_pass@postgres:5432/leoni_rh
      # Bono productividad (solo lectura): crear `.env` en la raíz con BONO_DB_* reales (compose sustituye ${BONO_DB_*})
      BONO_DB_HOST: ${BONO_DB_HOST:-host.docker.internal}
      BONO_DB_PORT: ${BONO_DB_PORT:-5433}
      BONO_DB_NAME: ${BONO_DB_NAME:-bono_productividad}
      BONO_DB_USER: ${BONO_DB_USER:-bono_user}
      BONO_DB_PASSWORD: ${BONO_DB_PASSWORD:-bono_password}
      BONO_DB_ENGINE: ${BONO_DB_ENGINE:-postgresql}
      APP_ENV: development
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.3}
      OLLAMA_HTTP_TIMEOUT: ${OLLAMA_HTTP_TIMEOUT:-180}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1536}
      OLLAMA_ACTA_NUM_PREDICT: ${OLLAMA_ACTA_NUM_PREDICT:-4096}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      # Chroma: evita intentos de telemetría fallidos en consola durante ingest/RAG
      ANONYMIZED_TELEMETRY: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: leoni_rh_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    container_name: leoni_rh_test
    volumes:
      - .:/app
    environment:
      APP_ENV: test
    profiles:
      - test

volumes:
  postgres_data:
    # Volumen creado por el proyecto anterior (leoni-rrhh); reutiliza los mismos datos.
    external: true
    name: leoni-rrhh_postgres_data
