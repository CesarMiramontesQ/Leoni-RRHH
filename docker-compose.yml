version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: leoni_rh_db
    environment:
      POSTGRES_DB: leoni_rh
      POSTGRES_USER: leoni
      POSTGRES_PASSWORD: leoni_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leoni -d leoni_rh"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
