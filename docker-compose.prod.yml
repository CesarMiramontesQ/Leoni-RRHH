# Producción V1.0: backend y frontend.
# PostgreSQL principal (leoni_rh) y bono_productividad son externos (cliente); sin contenedor de BD.
# Sin servicios Ollama, TRESS ni torniquete; el backend no recibe variables de esas integraciones.
#
# Proyecto Compose: leoni-rh-prod (aislado de leoni-rh-dev).
# Uso: docker compose -f docker-compose.prod.yml --env-file .env up -d
# Tras git pull con cambios en backend/alembic: build antes de up (ver scripts/prod-migrate.sh)
# Prueba en Mac en paralelo con dev: añadir -f docker-compose.prod.mac.yml
name: leoni-rh-prod

services:
  backend:
    build:
      context: .
      target: production
    container_name: leoni_rh_backend_prod
    ports:
      - "8000:8000"
    environment:
      # DATABASE_URL explícita tiene prioridad; si no, se arma con DB_* (ver .env.prod.example).
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_WAIT_MAX_RETRIES: ${DB_WAIT_MAX_RETRIES:-30}
      DB_WAIT_DELAY_SECONDS: ${DB_WAIT_DELAY_SECONDS:-2}
      # Bono productividad (solo lectura): scheduler nocturno e imports históricos (ver .env.prod.example)
      BONO_DB_HOST: ${BONO_DB_HOST:-}
      BONO_DB_PORT: ${BONO_DB_PORT:-5432}
      BONO_DB_NAME: ${BONO_DB_NAME:-}
      BONO_DB_USER: ${BONO_DB_USER:-}
      BONO_DB_PASSWORD: ${BONO_DB_PASSWORD:-}
      BONO_DB_ENGINE: ${BONO_DB_ENGINE:-postgresql}
      BONO_CALIDAD_HISTORICO_IMPORT_ENABLED: ${BONO_CALIDAD_HISTORICO_IMPORT_ENABLED:-true}
      BONO_CALIDAD_HISTORICO_IMPORT_CRON_HOUR: ${BONO_CALIDAD_HISTORICO_IMPORT_CRON_HOUR:-2}
      BONO_CALIDAD_HISTORICO_IMPORT_CRON_MINUTE: ${BONO_CALIDAD_HISTORICO_IMPORT_CRON_MINUTE:-0}
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # IT Mirror: opcional en V1.0; vacío = job de sync sin BD externa (ver app/main.py).
      IT_MIRROR_DB_URL: ${IT_MIRROR_DB_URL:-}
      IT_SYNC_INTERVAL_MINUTES: ${IT_SYNC_INTERVAL_MINUTES:-30}
      HUELLA_WHITELIST_IPS: ${HUELLA_WHITELIST_IPS:-}
      COMEDOR_TERMINAL_IPS: ${COMEDOR_TERMINAL_IPS:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
    restart: always

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: leoni_rh_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
