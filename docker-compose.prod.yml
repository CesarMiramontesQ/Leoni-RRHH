# Producción: se despliega desde `main` (o un tag de release). Ver docs/DEPLOY.md.
# BD única = Bono (PostgreSQL externo del cliente); sin contenedor de BD en Docker.
#
# Proyecto Compose: leoni-rh-prod (aislado de leoni-rh-dev).
# Uso en servidor:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# Tras git pull con cambios en backend/alembic:
#   ./scripts/prod-migrate.sh
# Si cambió el frontend:
#   ./scripts/prod-build-frontend.sh
name: leoni-rh-prod

services:
  backend:
    build:
      context: .
      target: production
    container_name: leoni_rh_backend_prod
    ports:
      - "8000:8000"
    environment:
      # BD única = Bono. Conexión EXCLUSIVAMENTE desde `.env` (sin defaults
      # hardcodeados). El backend arma DATABASE_URL desde BONO_DB_*; DATABASE_URL
      # explícita es override opcional (ver .env.prod.example).
      DATABASE_URL: ${DATABASE_URL:-}
      BONO_DB_HOST: ${BONO_DB_HOST}
      BONO_DB_PORT: ${BONO_DB_PORT:-5432}
      BONO_DB_NAME: ${BONO_DB_NAME}
      BONO_DB_USER: ${BONO_DB_USER}
      BONO_DB_PASSWORD: ${BONO_DB_PASSWORD}
      BONO_DB_ENGINE: ${BONO_DB_ENGINE:-postgresql}
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      IT_MIRROR_DB_URL: ${IT_MIRROR_DB_URL:-}
      # SQL Server datos-analisis (solo lectura; vacío = deshabilitado)
      DATOS_ANALISIS_DB_HOST: ${DATOS_ANALISIS_DB_HOST:-}
      DATOS_ANALISIS_DB_PORT: ${DATOS_ANALISIS_DB_PORT:-1433}
      DATOS_ANALISIS_DB_NAME: ${DATOS_ANALISIS_DB_NAME:-}
      DATOS_ANALISIS_DB_USER: ${DATOS_ANALISIS_DB_USER:-}
      DATOS_ANALISIS_DB_PASSWORD: ${DATOS_ANALISIS_DB_PASSWORD:-}
      DATOS_ANALISIS_DB_DRIVER: ${DATOS_ANALISIS_DB_DRIVER:-ODBC Driver 18 for SQL Server}
      # Segundos para establecer la conexion; el default del driver (15 s) cuelga
      # cada peticion que toque TRESS cuando no responde.
      DATOS_ANALISIS_DB_CONNECT_TIMEOUT: ${DATOS_ANALISIS_DB_CONNECT_TIMEOUT:-5}
      # true = la app sigue y no escribe a TRESS (pruebas en prod)
      TRESS_ESCRITURA_BLOQUEADA: ${TRESS_ESCRITURA_BLOQUEADA:-false}
      HUELLA_WHITELIST_IPS: ${HUELLA_WHITELIST_IPS:-}
      COMEDOR_TERMINAL_IPS: ${COMEDOR_TERMINAL_IPS:-}
      COMEDOR_ACCESO_HORA_INICIO: ${COMEDOR_ACCESO_HORA_INICIO:-}
      COMEDOR_ACCESO_HORA_FIN: ${COMEDOR_ACCESO_HORA_FIN:-}
      TORNIQUETE_API_KEY: ${TORNIQUETE_API_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      ESTADOS_ACTIVOS_IDS: ${ESTADOS_ACTIVOS_IDS:-1}
      ESTADOS_PERMISO_IDS: ${ESTADOS_PERMISO_IDS:-3}
      # Seed inicial (./scripts/prod-seed.sh): empleado_id real de Bono.empleados
      SEED_ADMIN_EMPLEADO_ID: ${SEED_ADMIN_EMPLEADO_ID:-}
      SEED_RH_PERMISOS_ADMIN_EMPLEADO_IDS: ${SEED_RH_PERMISOS_ADMIN_EMPLEADO_IDS:-}
    restart: always

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: leoni_rh_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
